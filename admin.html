const ToastCtx = createContext(null);
function ToastProvider({children}) {
  const [toasts, setToasts] = useState([]);

  return (
    <ToastCtx.Provider value={add}>
      {children}
      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className="toast-item">
            <i className={`fas ${icons[t.type]||icons.info} text-lg`}></i>
            <span className="text-sm text-gray-200">{t.msg}</span>
            <button onClick={() => setToasts(p=>p.filter(x=>x.id!==t.id))} className="ml-auto text-gray-600 hover:text-gray-300 text-lg leading-none">&times;</button>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}

// ═══════════════════════════════════════════
//  TIME SLOTS
// ═══════════════════════════════════════════
function getTimeSlots(dateStr, config) {
  if (!dateStr) return [];
  const dt = new Date(dateStr + 'T12:00:00');
  const dow = dt.getDay();
  if (!config.availableDays.includes(dow)) return [];
  const isSat = dow === 6;
  const start = isSat ? config.saturdayStart : config.weekdayStart;
  const end   = isSat ? config.saturdayEnd   : config.weekdayEnd;
  const slots = [];
  let [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  while (sh * 60 + sm < eh * 60 + em) {
    slots.push(`${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`);
    sm += 60; if (sm >= 60) { sh++; sm -= 60; }
  }
  return slots;
}

    const d = new Date(b.date+'T12:00:00'); const now = new Date();
    const start = new Date(now); start.setDate(now.getDate() - now.getDay() + 1);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return d >= start && d <= end;
  });
  const pending = bookings.filter(b => b.status === 'pending').length;
  const vips = clients.filter(c => c.isVIP).length;

  const svcCount = {};
  bookings.forEach(b => { svcCount[b.service] = (svcCount[b.service]||0) + 1; });
  const topSvc = Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const upcoming = bookings
    .filter(b => b.date >= todayStr && b.status !== 'cancelled')
    .sort((a,b) => (a.date+a.time) > (b.date+b.time) ? 1 : -1)
    .slice(0, 5);

  const now3 = new Date();
  const monthIncomeDash = bookings
    .filter(b => b.status==='completed' && b.paymentAmount != null && (() => { const d=new Date((b.paymentDate||b.date||'').slice(0,10)+'T12:00:00'); return d.getMonth()===now3.getMonth()&&d.getFullYear()===now3.getFullYear(); })())
    .reduce((s,b)=>s+(Number(b.paymentAmount)||0),0);

  const stats = [
    {icon:'fa-calendar-day', label:'Turnos hoy', value:todayBookings.length, sub:`${todayBookings.filter(b=>b.status==='confirmed').length} confirmados`, color:'text-brand', bg:'bg-brand/10'},
    {icon:'fa-calendar-week', label:'Esta semana', value:weekBookings.length, sub:`${weekBookings.filter(b=>b.status==='pending').length} pendientes`, color:'text-blue-400', bg:'bg-blue-400/10'},
    {icon:'fa-dollar-sign', label:'Ingresos del mes', value:fmtMoney(monthIncomeDash), sub:`${bookings.filter(b=>b.status==='completed').length} finalizados`, color:'text-emerald-400', bg:'bg-emerald-400/10'},
    {icon:'fa-clock', label:'Por confirmar', value:pending, sub:'turnos pendientes', color:'text-orange-400', bg:'bg-orange-400/10'},
  ];

  return (
    <div className="fade-in space-y-6">
      <div>
        <h1 className="text-xl font-bold">Dashboard</h1>
        <p className="text-sm text-gray-500 mt-0.5">{new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      </div>

      {/* Stat Cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {stats.map((s,i) => (
          <div key={i} className="stat-card">
            <div className={`w-10 h-10 rounded-xl ${s.bg} flex items-center justify-center mb-3`}>
              <i className={`fas ${s.icon} ${s.color}`}></i>
            </div>
            <div className="text-2xl font-bold mb-0.5">{s.value}</div>
            <div className="text-xs font-semibold text-gray-400">{s.label}</div>
            <div className="text-xs text-gray-600 mt-0.5">{s.sub}</div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
        {/* Próximos turnos */}
        <div className="card p-5 lg:col-span-3">
          <h2 className="font-semibold text-sm text-gray-300 mb-4 flex items-center gap-2">
            <i className="fas fa-calendar-alt text-brand"></i> Próximos turnos
          </h2>
          {upcoming.length === 0 ? (
            <p className="text-sm text-gray-600 text-center py-6">No hay turnos próximos</p>
          ) : (
            <div className="space-y-2">
              {upcoming.map(b => (
                <div key={b.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/2 hover:bg-white/4 transition-colors">
                  <div className="w-9 h-9 rounded-xl bg-brand/10 flex-shrink-0 flex items-center justify-center">
                    <i className="fas fa-user text-brand text-xs"></i>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-semibold truncate">{b.name}</div>
                    <div className="text-xs text-gray-500 truncate">{b.service}</div>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <div className="text-xs font-semibold text-gray-300">{fmtDate(b.date)}</div>
                    {b.time && <div className="text-xs text-gray-600">{b.time}</div>}
                  </div>
                  <StatusBadge status={b.status} />
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Servicios más solicitados */}
        <div className="card p-5 lg:col-span-2">
          <h2 className="font-semibold text-sm text-gray-300 mb-4 flex items-center gap-2">
            <i className="fas fa-chart-bar text-brand"></i> Más solicitados
          </h2>
          {topSvc.length === 0 ? (
            <p className="text-sm text-gray-600 text-center py-6">Sin datos aún</p>
          ) : (
            <div className="space-y-3">
              {topSvc.map(([name, count], i) => {
                const max = topSvc[0][1];
                return (
                  <div key={name}>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-gray-400 truncate mr-2">{name}</span>
                      <span className="text-brand font-bold flex-shrink-0">{count}</span>
                    </div>
                    <div className="h-1.5 bg-white/5 rounded-full overflow-hidden">
                      <div className="h-full bg-brand rounded-full transition-all" style={{width:`${(count/max)*100}%`}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="divider mt-5 mb-4"></div>
          <h2 className="font-semibold text-sm text-gray-300 mb-3 flex items-center gap-2">
            <i className="fas fa-fire text-orange-400"></i> Estado hoy
          </h2>
          {['pending','confirmed','in_progress','completed'].map(s => {
            const cnt = todayBookings.filter(b=>b.status===s).length;
            return cnt > 0 ? (
              <div key={s} className="flex items-center justify-between py-1.5">
                <StatusBadge status={s} />
                <span className="text-sm font-bold">{cnt}</span>
              </div>
            ) : null;
          })}
          {todayBookings.length === 0 && <p className="text-xs text-gray-600">Sin turnos hoy</p>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════
//  TURNO MODAL (crear / editar)
// ═══════════════════════════════════════════
function TurnoModal({turno, onClose, onSave, services, bookings, config}) {
  const isEdit = !!turno?.id;
  const [form, setForm] = useState({
    name:'', phone:'', email:'', vehicle:'', service:'', date:'', time:'', status:'pending', notes:'',
    ...(turno||{})
  });
  const toast = useToast();
  const set = (k, v) => setForm(p => ({...p, [k]:v}));

  const slots = getTimeSlots(form.date, config);
  const takenSlots = bookings
    .filter(b => b.date === form.date && b.status !== 'cancelled' && b.id !== form.id)
    .map(b => b.time);

  const save = () => {
    if (!form.name.trim()) return toast('Ingresá el nombre del cliente', 'error');
    if (!form.service) return toast('Seleccioná un servicio', 'error');
    if (!form.date) return toast('Seleccioná una fecha', 'error');
    if (!form.time) return toast('Seleccioná un horario', 'error');
    onSave({...form, id: form.id||uid(), createdAt: form.createdAt||new Date().toISOString()});
  };

  const activeServices = services.filter(s => s.active);

  return (
    <Modal title={isEdit ? 'Editar turno' : 'Nuevo turno'} onClose={onClose}
      footer={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-brand" onClick={save}><i className="fas fa-save"></i>{isEdit?'Guardar':'Crear turno'}</button></>}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <FormField label="Nombre" required>
          <input className="input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ej: Juan García" />
        </FormField>
        <FormField label="Teléfono">
          <input className="input" value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="Ej: 1156359321" />
        </FormField>
        <FormField label="Email">
          <input className="input" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@ejemplo.com" />
        </FormField>
        <FormField label="Vehículo">
          <input className="input" value={form.vehicle} onChange={e=>set('vehicle',e.target.value)} placeholder="Ej: VW Gol 2019 blanco" />
        </FormField>
        <FormField label="Servicio" required>
          <select className="input" value={form.service} onChange={e=>set('service',e.target.value)}>
            <option value="">Seleccionar...</option>
            {activeServices.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </FormField>
        <FormField label="Estado">
          <select className="input" value={form.status} onChange={e=>set('status',e.target.value)}>
            {Object.entries(STATUS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
        </FormField>
        <FormField label="Fecha" required>
          <input className="input" type="date" value={form.date} onChange={e=>{set('date',e.target.value);set('time','')}} />
        </FormField>
        <FormField label="Horario" required>
          {slots.length === 0 ? (
            <div className="input text-gray-600 text-sm">{form.date ? 'Sin turnos disponibles' : 'Elegí una fecha primero'}</div>
          ) : (
            <select className="input" value={form.time} onChange={e=>set('time',e.target.value)}>
              <option value="">Seleccionar...</option>
              {slots.map(t => (
                <option key={t} value={t} disabled={takenSlots.includes(t)}>
                  {t}{takenSlots.includes(t) ? ' — ocupado' : ''}
                </option>
              ))}
            </select>
          )}
        </FormField>
        <div className="sm:col-span-2">
          <FormField label="Notas internas">
            <textarea className="input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Observaciones, detalles del trabajo..." />
          </FormField>
        </div>
      </div>
    </Modal>
  );
}

// ═══════════════════════════════════════════
//  PAYMENT MODAL
// ═══════════════════════════════════════════
function PaymentModal({turno, onClose, onSave}) {
  const [form, setForm] = useState({
    priceEstimate: turno.priceEstimate || '',
    paymentAmount: turno.paymentAmount || '',
    paymentMethod: turno.paymentMethod || 'Efectivo',
    paymentNotes:  turno.paymentNotes  || '',
  });
  const toast = useToast();
  const set = (k,v) => setForm(p => ({...p,[k]:v}));

  const calcStatus = (amount, estimate) => {
    const a = Number(amount); const e = Number(estimate);
    if (!a) return 'unpaid';
    if (e && a < e) return 'partial';
    return 'paid';
  };

  const saveFn = () => {
    const ps = calcStatus(form.paymentAmount, form.priceEstimate);
    onSave({
      ...turno,
      status: 'completed',
      paymentStatus:  ps,
      paymentAmount:  form.paymentAmount !== '' ? Number(form.paymentAmount) : undefined,
      paymentMethod:  form.paymentMethod,
      paymentNotes:   form.paymentNotes,
      priceEstimate:  form.priceEstimate !== '' ? Number(form.priceEstimate) : undefined,
      paymentDate:    new Date().toISOString(),
    });
  };

  const skip = () => {
    onSave({...turno, status:'completed', paymentStatus:'unpaid'});
  };

  const previewStatus = calcStatus(form.paymentAmount, form.priceEstimate);

  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal fade-in" style={{maxWidth:460}} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-5 border-b border-[#1e1e1e]">
          <div>
            <h3 className="font-semibold text-base flex items-center gap-2">
              <i className="fas fa-dollar-sign text-brand"></i> Registrar cobro
            </h3>
            <p className="text-xs text-gray-500 mt-0.5">Turno finalizado — {turno.name}</p>
          </div>
          <button className="w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/5" onClick={onClose}>
            <i className="fas fa-times"></i>
          </button>
        </div>
        {/* Turno summary */}
        <div className="mx-5 mt-5 p-3 rounded-xl bg-white/3 border border-white/5 flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl bg-brand/10 flex items-center justify-center flex-shrink-0">
            <i className="fas fa-car text-brand text-sm"></i>
          </div>
          <div className="min-w-0">
            <div className="text-sm font-semibold">{turno.service || '—'}</div>
            <div className="text-xs text-gray-500">{fmtDate(turno.date)}{turno.time ? ` — ${turno.time}` : ''}{turno.vehicle ? ` · ${turno.vehicle}` : ''}</div>
          </div>
        </div>
        <div className="p-5 space-y-4">
          <div className="grid grid-cols-2 gap-4">
            <FormField label="Presupuesto estimado">
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm">$</span>
                <input className="input pl-7" type="number" min="0" placeholder="0"
                  value={form.priceEstimate} onChange={e=>set('priceEstimate',e.target.value)} />
              </div>
            </FormField>
            <FormField label="Monto abonado">
              <div className="relative">
                <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-500 text-sm">$</span>
                <input className="input pl-7" type="number" min="0" placeholder="0" autoFocus
                  value={form.paymentAmount} onChange={e=>set('paymentAmount',e.target.value)} />
              </div>
            </FormField>
          </div>
          <FormField label="Método de pago">
            <div className="flex gap-2 flex-wrap">
              {PAYMENT_METHODS.map(m => (
                <button key={m} type="button" onClick={()=>set('paymentMethod',m)}
                  className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all border ${form.paymentMethod===m?'bg-brand/15 border-brand/40 text-brand':'bg-white/3 border-white/5 text-gray-400 hover:border-white/10'}`}>
                  {m}
                </button>
              ))}
            </div>
          </FormField>
          <FormField label="Observaciones">
            <input className="input" value={form.paymentNotes} onChange={e=>set('paymentNotes',e.target.value)}
              placeholder="Ej: pagó con transferencia, falta seña..." />
          </FormField>
          {/* Status preview */}
          <div className="flex items-center gap-2 p-3 rounded-xl bg-white/2">
            <span className="text-xs text-gray-500">Estado del pago:</span>
            <PaymentBadge status={previewStatus} />
            {form.priceEstimate && form.paymentAmount && (
              <span className="text-xs text-gray-600 ml-auto">
                {fmtMoney(form.paymentAmount)} / {fmtMoney(form.priceEstimate)}
              </span>
            )}
          </div>
        </div>
        <div className="p-5 border-t border-[#1e1e1e] flex gap-3">
          <button className="btn btn-ghost text-xs" onClick={skip}>Omitir por ahora</button>
          <div className="flex gap-2 ml-auto">
            <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
            <button className="btn btn-brand" onClick={saveFn}><i className="fas fa-save"></i> Guardar cobro</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════
//  TURNOS PAGE
// ═══════════════════════════════════════════
function TurnosPage({bookings, setBookings, services, config, clients, setClients}) {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // null | 'new' | turno
  const [paymentModal, setPaymentModal] = useState(null); // null | turno
  const toast = useToast();
  const confirm = useConfirm();

  // Verifica si el booking ya existe como cliente (por teléfono o por nombre exacto)
  const isNewClient = b => {
    if (!clients || clients.length === 0) return true;
    const phone = (b.phone||'').replace(/\D/g,'');
    const name  = (b.name||'').trim().toLowerCase();
    return !clients.some(c => {
      const cp = (c.phone||'').replace(/\D/g,'');
      const cn = (c.name||'').trim().toLowerCase();
      return (phone && cp && phone === cp) || (name && cn && name === cn);
    });
  };

  const addClientFromBooking = b => {
    const newClient = {
      id: uid(),
      name:    b.name    || '',
      phone:   b.phone   || '',
      email:   b.email   || '',
      vehicle: b.vehicle || '',
      isVIP:   false,
      createdAt: new Date().toISOString(),
    };
    setClients(prev => {
      const n = [newClient, ...prev];
      save('morrey_clients', n);
      return n;
    });
    toast(`${b.name} agregado como cliente`, 'success');
  };

  const filtered = bookings
    .filter(b => filter==='all' || b.status===filter)
    .filter(b => !dateFilter || b.date===dateFilter)
    .filter(b => !search || b.name?.toLowerCase().includes(search.toLowerCase()) || b.phone?.includes(search) || b.vehicle?.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => (a.date+a.time) > (b.date+b.time) ? -1 : 1);

  const saveTurno = async (t) => {
    const isEdit = !!bookings.find(b => b.id === t.id);
    if (isEdit) {
      const { error } = await _db.from('bookings').update(toDbUpdate(t)).eq('id', t.id);
      if (error) { toast('Error al guardar el turno', 'error'); return; }
      setBookings(prev => prev.map(b => b.id === t.id ? t : b));
      toast('Turno actualizado', 'success');
    } else {
      const { error } = await _db.from('bookings').insert(toDb(t));
      if (error) { toast('Error al crear el turno', 'error'); return; }
      setBookings(prev => [t, ...prev]);
      toast('Turno creado', 'success');
    }
    setModal(null);
  };

  const deleteTurno = (id) => {
    confirm('¿Eliminar este turno? Esta acción no se puede deshacer.', async () => {
      const { error } = await _db.from('bookings').delete().eq('id', id);
      if (error) { toast('Error al eliminar', 'error'); return; }
      setBookings(prev => prev.filter(b => b.id !== id));
      toast('Turno eliminado', 'info');
    });
  };

  const changeStatus = async (id, status) => {
    if (status === 'completed') {
      const turno = bookings.find(b => b.id === id);
      const { error } = await _db.from('bookings').update({status}).eq('id', id);
      if (error) { toast('Error al actualizar estado', 'error'); return; }
      setBookings(prev => prev.map(b => b.id === id ? {...b, status} : b));
      setPaymentModal({...turno, status: 'completed'});
      return;
    }
    const { error } = await _db.from('bookings').update({status}).eq('id', id);
    if (error) { toast('Error al actualizar estado', 'error'); return; }
    setBookings(prev => prev.map(b => b.id === id ? {...b, status} : b));
    toast(`Estado actualizado a "${STATUS[status].label}"`, 'success');
  };

  const savePayment = async (updated) => {
    const { error } = await _db.from('bookings').update(toDbUpdate(updated)).eq('id', updated.id);
    if (error) { toast('Error al guardar cobro', 'error'); return; }
    setBookings(prev => prev.map(b => b.id === updated.id ? updated : b));
    setPaymentModal(null);
    const ps = updated.paymentStatus;
    toast(ps==='paid' ? '¡Cobro registrado!' : ps==='partial' ? 'Pago parcial registrado' : 'Turno finalizado sin cobro', ps==='paid'?'success':'info');
  };

  const sendWA = (b) => {
    const cfg = load('morrey_config', DEFAULT_CONFIG);
    const dayStr = fmtDateLong(b.date);
    const msg = cfg.confirmMsg
      .replace('[nombre]', b.name||'')
      .replace('[dia]', dayStr)
      .replace('[hora]', b.time||'');
    const phone = b.phone?.replace(/\D/g,'');
    window.open(`https://wa.me/54${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  const sendReminder = (b) => {
    const cfg = load('morrey_config', DEFAULT_CONFIG);
    const msg = cfg.reminderMsg.replace('[hora]', b.time||'');
    const phone = b.phone?.replace(/\D/g,'');
    window.open(`https://wa.me/54${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  const tabs = [
    {k:'all',label:'Todos',count:bookings.length},
    {k:'pending',label:'Pendientes',count:bookings.filter(b=>b.status==='pending').length},
    {k:'confirmed',label:'Confirmados',count:bookings.filter(b=>b.status==='confirmed').length},
    {k:'in_progress',label:'En proceso',count:bookings.filter(b=>b.status==='in_progress').length},
    {k:'completed',label:'Finalizados',count:bookings.filter(b=>b.status==='completed').length},
    {k:'cancelled',label:'Cancelados',count:bookings.filter(b=>b.status==='cancelled').length},
  ];

  return (
    <div className="fade-in space-y-5">
      <PageHeader title="Gestión de Turnos" subtitle={`${bookings.length} turnos en total`}
        action={<button className="btn btn-brand" onClick={()=>setModal('new')}><i className="fas fa-plus"></i><span className="hidden sm:inline">Nuevo turno</span></button>} />

      {/* Filters */}
      <div className="card p-4 space-y-3">
        <div className="flex gap-2 overflow-x-auto pb-1 -mb-1 scrollbar-hide">
          {tabs.map(t => (
            <button key={t.k} onClick={()=>setFilter(t.k)} className={`pill-filter flex-shrink-0 ${filter===t.k?'active':''}`}>
              {t.label}
              {t.count>0 && <span className={`ml-1 text-xs px-1.5 py-0.5 rounded-full ${filter===t.k?'bg-brand/20 text-brand':'bg-white/5 text-gray-500'}`}>{t.count}</span>}
            </button>
          ))}
        </div>
        <div className="flex gap-3">
          <div className="relative flex-1">
            <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-sm"></i>
            <input className="input pl-9" placeholder="Buscar por nombre, teléfono, vehículo..." value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
          <input className="input w-40" type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)} />
          {(dateFilter||search) && <button className="btn btn-ghost btn-sm" onClick={()=>{setDateFilter('');setSearch('')}}>Limpiar</button>}
        </div>
      </div>

      {/* List */}
      {filtered.length === 0 ? (
        <EmptyState icon="fa-calendar-times" title="Sin turnos" desc="No hay turnos que coincidan con los filtros."
          action={<button className="btn btn-brand btn-sm" onClick={()=>setModal('new')}><i className="fas fa-plus"></i>Crear turno</button>} />
      ) : (
        <div className="space-y-3">
          {filtered.map(b => {
            const isNew = b.createdAt && (Date.now() - new Date(b.createdAt).getTime()) < 24*60*60*1000 && b.status==='pending';
            return (
            <div key={b.id} className={`card p-4 transition-colors ${isNew ? 'border-brand/30 hover:border-brand/50' : 'hover:border-[#2a2a2a]'}`}>
              {isNew && (
                <div className="flex items-center gap-1.5 text-[10px] font-bold text-brand uppercase tracking-wider mb-2.5">
                  <span className="w-1.5 h-1.5 rounded-full bg-brand inline-block animate-pulse"></span>
                  Nuevo turno
                </div>
              )}
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl bg-brand/10 flex-shrink-0 flex items-center justify-center">
                  <i className="fas fa-user text-brand text-sm"></i>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold text-sm">{b.name}</span>
                    <StatusBadge status={b.status} />
                    {b.status==='completed' && <PaymentBadge status={b.paymentStatus||'unpaid'} />}
                  </div>
                  <div className="flex items-center gap-3 flex-wrap mt-1">
                    {b.phone && <span className="text-xs text-gray-500 flex items-center gap-1"><i className="fas fa-phone"></i>{b.phone}</span>}
                    {b.vehicle && <span className="text-xs text-gray-500 flex items-center gap-1"><i className="fas fa-car"></i>{b.vehicle}</span>}
                  </div>
                  <div className="flex items-center gap-3 flex-wrap mt-1.5">

                    onClick={()=>changeStatus(b.id,'completed')}>

function ClienteModal({cliente, onClose, onSave}) {

function GaleriaPage() {
  const [hidden,   setHidden]   = useState(() => load('morrey_hidden_gallery', []));
  const [extras,   setExtras]   = useState(() => load('morrey_extra_gallery', []));
  const [featured, setFeatured] = useState(() => load('morrey_featured_gallery', []));
  const [deleted,  setDeleted]  = useState(() => load('morrey_deleted_gallery', []));
  const [imgErr,   setImgErr]   = useState({}); // name → 'retry' | 'failed'
  const fileRef = useRef();
  const toast   = useToast();
  const confirm = useConfirm();

  // Build filtered list of built-in images (not deleted)
  const builtIn = Array.from({length:34}, (_,i) => `${i+1}.jpg`).filter(n => !deleted.includes(n));

  const resolvedSrc = name => imgErr[name] === 'failed' ? null : name;

  const handleImgError = name => {
    setImgErr(p => ({...p, [name]: 'failed'}));
  };

  const toggleHidden = name => {
    const n = hidden.includes(name) ? hidden.filter(h=>h!==name) : [...hidden, name];
    setHidden(n); save('morrey_hidden_gallery', n);
    toast(hidden.includes(name) ? 'Imagen visible en el sitio' : 'Imagen oculta en el sitio', 'info');
  };

  const toggleFeatured = name => {
    const n = featured.includes(name) ? featured.filter(f=>f!==name) : [...featured, name];
    setFeatured(n); save('morrey_featured_gallery', n);
  };

  const deleteBuiltIn = name => {
    confirm('¿Quitar esta foto de la galería del admin? El archivo físico no se borra.', () => {
      const nd = [...deleted, name];
      const nh = hidden.filter(h=>h!==name);
      const nf = featured.filter(f=>f!==name);
      setDeleted(nd); save('morrey_deleted_gallery', nd);
      setHidden(nh);  save('morrey_hidden_gallery', nh);
      setFeatured(nf);save('morrey_featured_gallery', nf);
      toast('Foto quitada de la galería', 'info');
    });
  };

  const deleteExtra = id => {
    confirm('¿Eliminar esta imagen subida?', () => {
      const n = extras.filter(e=>e.id!==id);
      setExtras(n); save('morrey_extra_gallery', n);
      toast('Imagen eliminada', 'info');
    });
  };

  const upload = e => {
    const files = Array.from(e.target.files);
    files.forEach(f => {
      if (!f.type.startsWith('image/')) return;
      if (f.size > 8*1024*1024) { toast(`${f.name} supera 8MB`, 'error'); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        const item = {id:uid(), src:ev.target.result, name:f.name, addedAt:new Date().toISOString()};
        setExtras(prev => { const n=[...prev,item]; save('morrey_extra_gallery',n); return n; });
        toast('Foto subida — aparecerá en la galería del sitio', 'success');
      };
      reader.readAsDataURL(f);
    });
    e.target.value = '';
  };

  const visibleBuiltIn = builtIn.filter(n => !hidden.includes(n)).length;
  const totalVisible   = visibleBuiltIn + extras.length;

  // Reusable cell for built-in images
  const BuiltInCell = ({name}) => {
    const isH = hidden.includes(name);
    const src = resolvedSrc(name);
    return (
      <div style={{background:'#161616', borderRadius:12, overflow:'hidden', border:'1px solid #222'}}>
        {/* Image */}
        <div style={{aspectRatio:'1/1', background:'#181818', position:'relative'}}>
          {!src ? (
            <div style={{width:'100%',height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,opacity:0.4}}>
              <i className="fas fa-image" style={{color:'#555',fontSize:22}}></i>
              <span style={{color:'#555',fontSize:10,textAlign:'center',padding:'0 4px'}}>{name}</span>
            </div>
          ) : (
            <img src={src} alt={name} style={{width:'100%',height:'100%',objectFit:'cover',display:'block',opacity:isH?0.35:1}}
              onError={() => handleImgError(name)} />
          )}
          {isH && (
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',pointerEvents:'none'}}>
              <span style={{fontSize:9,background:'rgba(0,0,0,.75)',color:'#888',padding:'2px 6px',borderRadius:4}}>oculta</span>
            </div>
          )}
        </div>
        {/* Buttons always visible */}
        <div style={{display:'flex',gap:4,padding:'5px 6px',background:'#111'}}>
          <button onClick={()=>toggleHidden(name)}
            style={{flex:1,fontSize:10,padding:'4px 0',borderRadius:6,fontWeight:600,cursor:'pointer',border:'none',
              background:isH?'rgba(255,222,0,.2)':'rgba(255,255,255,.07)',color:isH?'#ffde00':'#aaa'}}>
            {isH ? 'Mostrar' : 'Ocultar'}
          </button>
          <button onClick={()=>deleteBuiltIn(name)}
            style={{flex:1,fontSize:10,padding:'4px 0',borderRadius:6,fontWeight:600,cursor:'pointer',border:'none',
              background:'rgba(239,68,68,.12)',color:'#ef4444'}}>
            Eliminar
          </button>
        </div>
      </div>
    );
  };

  return (
    <div className="fade-in space-y-5">
      <PageHeader title="Galería" subtitle={`${totalVisible} fotos visibles en el sitio`}
        action={<><input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={upload} /><button className="btn btn-brand" onClick={()=>fileRef.current.click()}><i className="fas fa-upload"></i><span className="hidden sm:inline">Subir fotos</span></button></>} />

      <div className="card p-3 flex items-start gap-2 text-xs text-gray-500">
        <i className="fas fa-circle-info text-blue-400 mt-0.5 flex-shrink-0"></i>
        <span>Las fotos que subas aparecen en la galería del sitio. Podés <strong className="text-gray-400">ocultar</strong> una foto (queda en el admin pero no en el sitio) o <strong className="text-gray-400">eliminarla</strong> (desaparece del admin).</span>
      </div>

      {extras.length > 0 && (
        <>
          <div>
            <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Fotos subidas por vos ({extras.length})</h2>
            <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
              {extras.map(img => (
                <div key={img.id} style={{background:'#161616',borderRadius:12,overflow:'hidden',border:'1px solid #222'}}>
                  <div style={{aspectRatio:'1/1',background:'#181818',position:'relative'}}>
                    <img src={img.src} alt={img.name} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}} />
                    <span style={{position:'absolute',top:3,right:3,fontSize:9,background:'#ffde00',color:'#000',padding:'1px 5px',borderRadius:4,fontWeight:700,pointerEvents:'none'}}>Nueva</span>
                  </div>
                  <div style={{padding:'5px 6px',background:'#111'}}>
                    <button onClick={()=>deleteExtra(img.id)}
                      style={{width:'100%',fontSize:10,padding:'4px 0',borderRadius:6,fontWeight:600,cursor:'pointer',border:'none',background:'rgba(239,68,68,.12)',color:'#ef4444'}}>
                      Eliminar
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
          <div className="divider"></div>
        </>
      )}

      <div>
        <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">
          Fotos del sitio ({builtIn.length}{hidden.filter(n=>builtIn.includes(n)).length > 0 ? ` · ${hidden.filter(n=>builtIn.includes(n)).length} ocultas` : ''})
        </h2>
        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
          {builtIn.map(name => <BuiltInCell key={name} name={name} />)}
        </div>
      </div>
    </div>
  );
}

function TestimonioModal({t, onClose, onSave, services}) {
  const [form, setForm] = useState({
    name:'', comment:'', rating:5, service:'', vehicle:'',
    photo:null, showPhoto:true, status:'published', featured:false,
    ...(t||{})
  });
  const [preview, setPreview] = useState(t?.photo||null);
  const fileRef = useRef();
  const toast = useToast();
  const set = (k,v) => setForm(p=>({...p,[k]:v}));

  const uploadPhoto = e => {
    const f = e.target.files[0]; if (!f) return;
    if (!f.type.startsWith('image/')) return toast('Solo se permiten imágenes', 'error');
    if (f.size > 5*1024*1024) return toast('La imagen no puede superar 5MB', 'error');
    const reader = new FileReader();
    reader.onload = ev => { set('photo', ev.target.result); setPreview(ev.target.result); };
    reader.readAsDataURL(f);
    e.target.value = '';
  };

  const removePhoto = () => { set('photo', null); setPreview(null); };

  const saveFn = () => {
    if (!form.name.trim()) return toast('Ingresá el nombre del cliente', 'error');
    if (!form.comment.trim()) return toast('Ingresá el comentario', 'error');
    if (form.comment.length > 500) return toast('El comentario no puede superar 500 caracteres', 'error');
    onSave({...form, id:form.id||uid(), createdAt:form.createdAt||new Date().toISOString(), source:form.source||'admin'});
  };

  const activeServices = services ? services.filter(s=>s.active) : [];
  const charLeft = 500 - (form.comment?.length||0);

  return (
    <Modal title={t?.id?'Editar testimonio':'Nuevo testimonio'} onClose={onClose}
      footer={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-brand" onClick={saveFn}><i className="fas fa-save"></i>Guardar</button></>}>
      <div className="space-y-4">
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <FormField label="Nombre del cliente" required>
            <input className="input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ej: Martín G." />
          </FormField>
          <FormField label="Vehículo">
            <input className="input" value={form.vehicle} onChange={e=>set('vehicle',e.target.value)} placeholder="Ej: Toyota Corolla" />
          </FormField>
        </div>
        {activeServices.length > 0 && (
          <FormField label="Servicio realizado">
            <select className="input" value={form.service} onChange={e=>set('service',e.target.value)}>
              <option value="">Sin especificar</option>
              {activeServices.map(s=><option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          </FormField>
        )}
        <FormField label="Comentario" required>
          <textarea className="input" value={form.comment} onChange={e=>set('comment',e.target.value)}
            placeholder="¿Qué dijo el cliente sobre el trabajo?" style={{minHeight:100}} />
          <span className={`text-xs ml-auto self-end ${charLeft<50?'text-red-400':'text-gray-600'}`}>{charLeft} caracteres restantes</span>
        </FormField>
        <FormField label="Puntuación">
          <div className="flex gap-2 items-center">
            <Stars n={form.rating} onChange={v=>set('rating',v)} />
            <span className="text-sm text-gray-500">{form.rating}/5</span>
          </div>
        </FormField>
        {/* Photo */}
        <FormField label="Foto del auto (opcional)">
          {preview ? (
            <div className="relative">
              <img src={preview} alt="preview" className="w-full rounded-xl object-cover" style={{maxHeight:180}} />
              <button onClick={removePhoto}
                className="absolute top-2 right-2 w-7 h-7 rounded-lg bg-red-500 text-white flex items-center justify-center">
                <i className="fas fa-times text-xs"></i>
              </button>
              <div className="flex items-center gap-2 mt-2">
                <button type="button" onClick={()=>set('showPhoto',!form.showPhoto)}
                  className={`w-4 h-4 rounded border flex items-center justify-center ${form.showPhoto?'bg-brand border-brand':'border-gray-600'}`}>
                  {form.showPhoto&&<i className="fas fa-check text-black text-[9px]"></i>}
                </button>
                <span className="text-xs text-gray-500">Mostrar foto en el sitio</span>
              </div>
            </div>
          ) : (
            <><input ref={fileRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={uploadPhoto} />
            <button type="button" onClick={()=>fileRef.current.click()}
              className="w-full border-2 border-dashed border-[#252525] rounded-xl py-6 text-gray-600 hover:border-[#333] hover:text-gray-400 transition-colors text-sm flex flex-col items-center gap-2">
              <i className="fas fa-camera text-xl"></i>JPG, PNG o WebP · máx. 5MB
            </button></>
          )}
        </FormField>
        {/* Meta */}
        <div className="grid grid-cols-2 gap-4">
          <FormField label="Estado">
            <select className="input" value={form.status} onChange={e=>set('status',e.target.value)}>
              <option value="published">Publicado</option>
              <option value="pending">Pendiente</option>
              <option value="hidden">Oculto</option>
            </select>
          </FormField>
          <FormField label="Destacado">
            <div className="flex items-center gap-2 h-10 mt-0.5">
              <button type="button" onClick={()=>set('featured',!form.featured)}
                className={`w-5 h-5 rounded border-2 flex items-center justify-center ${form.featured?'bg-brand border-brand':'border-gray-600'}`}>
                {form.featured&&<i className="fas fa-check text-black text-xs"></i>}
              </button>
              <span className="text-sm text-gray-400">Mostrar primero <span className="text-brand">⭐</span></span>
            </div>
          </FormField>
        </div>
      </div>
    </Modal>
  );
}

function TestimoniosPage({items, setItems, services}) {
  const [filter, setFilter] = useState('all');
  const [modal, setModal] = useState(null);
  const toast = useToast();
  const confirm = useConfirm();

  const pendingCount = items.filter(t => !t.status || t.status==='pending').length;

  const filtered = [...items]
    .filter(t => {
      if (filter === 'all') return true;
      if (filter === 'pending') return !t.status || t.status === 'pending';
      return t.status === filter;
    })
    .sort((a,b) => {
      // Más recientes primero
      return (b.createdAt||'') > (a.createdAt||'') ? 1 : -1;
    });

  const saveItem = t => {
    setItems(prev => {
      const exists = prev.find(x=>x.id===t.id);
      // Los nuevos se agregan al FINAL para que los existentes no desaparezcan de la vista
      const n = exists ? prev.map(x=>x.id===t.id?t:x) : [...prev, t];
      save('morrey_testimonials', n);
      return n;
    });
    toast('Testimonio guardado', 'success');
    setModal(null);
  };

  const deleteItem = id => {
    confirm('¿Eliminar este testimonio? No se puede deshacer.', () => {
      setItems(prev => { const n=prev.filter(t=>t.id!==id); save('morrey_testimonials',n); return n; });
      toast('Eliminado', 'info');
    });
  };

  const changeStatus = (id, status) => {
    setItems(prev => { const n=prev.map(t=>t.id===id?{...t,status}:t); save('morrey_testimonials',n); return n; });
    toast(TESTIMONIO_STATUS[status].label, 'success');
  };

  const toggleFeatured = id => {
    setItems(prev => { const n=prev.map(t=>t.id===id?{...t,featured:!t.featured}:t); save('morrey_testimonials',n); return n; });
  };

  const toggleShowPhoto = id => {
    setItems(prev => { const n=prev.map(t=>t.id===id?{...t,showPhoto:!t.showPhoto}:t); save('morrey_testimonials',n); return n; });
  };

  const tabs = [
    {k:'all',      label:'Todos',      count:items.length},
    {k:'pending',  label:'Pendientes', count:items.filter(t=>!t.status||t.status==='pending').length},
    {k:'published',label:'Publicados', count:items.filter(t=>t.status==='published').length},
    {k:'hidden',   label:'Ocultos',    count:items.filter(t=>t.status==='hidden').length},
  ];

  return (
    <div className="fade-in space-y-5">
      <PageHeader
        title="Testimonios"
        subtitle={`${items.length} reseñas${pendingCount>0?` · ${pendingCount} pendientes de revisión`:''}`}
        action={<button className="btn btn-brand" onClick={()=>setModal('new')}><i className="fas fa-plus"></i><span className="hidden sm:inline">Nuevo</span></button>}
      />

      {/* Info pendientes */}
      {pendingCount > 0 && (
        <div className="flex items-center gap-3 p-4 rounded-xl border border-yellow-500/20 bg-yellow-500/5">
          <i className="fas fa-clock text-yellow-400"></i>
          <span className="text-sm text-yellow-300">{pendingCount} testimonio{pendingCount>1?'s':''} enviado{pendingCount>1?'s':''} desde la web esperando tu revisión.</span>
          <button className="btn btn-sm ml-auto" style={{background:'rgba(234,179,8,.15)',color:'#facc15',border:'1px solid rgba(234,179,8,.25)'}}
            onClick={()=>setFilter('pending')}>Ver pendientes</button>
        </div>
      )}

      {/* Status tabs */}
      <div className="card p-3 flex gap-2 overflow-x-auto">
        {tabs.map(t => (
          <button key={t.k} onClick={()=>setFilter(t.k)} className={`pill-filter flex-shrink-0 ${filter===t.k?'active':''}`}>
            {t.label}
            {t.count > 0 && <span className={`ml-1 text-xs px-1.5 py-0.5 rounded-full ${filter===t.k?'bg-brand/20 text-brand':'bg-white/5 text-gray-500'}`}>{t.count}</span>}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <EmptyState icon="fa-star" title="Sin testimonios" desc="No hay testimonios en esta categoría."
          action={<button className="btn btn-brand btn-sm" onClick={()=>setModal('new')}><i className="fas fa-plus"></i>Agregar</button>} />
      ) : (
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(270px, 1fr))', gap:16}}>
          {filtered.map(t => {
            const status = t.status || 'pending';
            const isPending = status === 'pending';
            return (
              <div key={t.id} className={`card p-5 flex flex-col gap-3 ${isPending?'border-yellow-500/20':''}`}>
                {/* Photo */}
                {t.photo && (
                  <div className="relative rounded-xl overflow-hidden" style={{height:120}}>
                    <img src={t.photo} alt="" className="w-full h-full object-cover" style={{opacity:t.showPhoto===false?0.2:1}} />
                    {t.showPhoto === false && (
                      <div className="absolute inset-0 flex items-center justify-center bg-black/60">
                        <span className="text-xs text-gray-400 flex items-center gap-1"><i className="fas fa-eye-slash"></i>Foto oculta</span>
                      </div>
                    )}
                    <button onClick={()=>toggleShowPhoto(t.id)} title={t.showPhoto===false?'Mostrar foto':'Ocultar foto'}
                      className="absolute top-2 right-2 w-7 h-7 rounded-lg bg-black/60 text-white flex items-center justify-center hover:bg-black/80 transition-colors">
                      <i className={`fas ${t.showPhoto===false?'fa-eye':'fa-eye-slash'} text-xs`}></i>
                    </button>
                  </div>
                )}
                {/* Header */}
                <div className="flex items-start justify-between gap-2">
                  <div className="flex items-center gap-2 flex-wrap">
                    <TestimonioBadge status={status} />
                    {t.featured && <span className="text-xs text-brand">⭐ Destacado</span>}
                    {t.source === 'web' && <span className="badge bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs">Web</span>}
                  </div>
                  <div className="flex gap-1 flex-shrink-0">
                    <button className="btn btn-ghost btn-sm" onClick={()=>setModal(t)} title="Editar"><i className="fas fa-pencil text-xs"></i></button>
                    <button className="btn btn-ghost btn-sm text-red-500" onClick={()=>deleteItem(t.id)} title="Eliminar"><i className="fas fa-trash text-xs"></i></button>
                  </div>
                </div>
                {/* Stars */}
                {t.rating > 0 && <Stars n={t.rating||t.stars||5} />}
                {/* Comment */}
                <p className="text-sm text-gray-300 leading-relaxed italic flex-1">"{t.comment||t.text}"</p>
                {/* Client */}
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-brand/10 flex items-center justify-center text-xs font-bold text-brand flex-shrink-0">
                    {(t.name||'?').charAt(0).toUpperCase()}
                  </div>
                  <div className="min-w-0">
                    <div className="text-sm font-semibold">{t.name}</div>
                    {(t.vehicle||t.service) && <div className="text-xs text-gray-600 truncate">{t.vehicle||t.service}</div>}
                  </div>
                </div>
                {/* Actions */}
                <div className="flex gap-2 flex-wrap pt-2 border-t border-[#1a1a1a]">
                  {status !== 'published' && (
                    <button className="btn btn-sm btn-green flex-1" onClick={()=>changeStatus(t.id,'published')}>
                      <i className="fas fa-check"></i> Publicar
                    </button>
                  )}
                  {status !== 'hidden' && (
                    <button className="btn btn-ghost btn-sm flex-1" onClick={()=>changeStatus(t.id,'hidden')}>
                      <i className="fas fa-eye-slash"></i> Ocultar
                    </button>
                  )}
                  {status !== 'pending' && (
                    <button className="btn btn-ghost btn-sm" onClick={()=>changeStatus(t.id,'pending')}>
                      <i className="fas fa-rotate-left"></i>
                    </button>
                  )}
                  <button onClick={()=>toggleFeatured(t.id)} title={t.featured?'Quitar destacado':'Destacar'}
                    className={`btn btn-sm ml-auto ${t.featured?'':'btn-ghost'}`}
                    style={t.featured?{background:'rgba(255,222,0,.15)',color:'#ffde00',border:'1px solid rgba(255,222,0,.3)'}:{}}>
                    <i className="fas fa-star"></i>
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {modal && <TestimonioModal t={modal==='new'?null:modal} onClose={()=>setModal(null)} onSave={saveItem} services={services} />}
    </div>
  );
}

function PackModal({pack, onClose, onSave}) {

  const set = (k,v) => setForm(p=>({...p,[k]:v}));

    if (!form.name.trim()) return toast('Ingresá el nombre', 'error');
    onSave({...form, id:form.id||uid()});

  return (
    <Modal title={pack?.id?'Editar pack':'Nuevo pack'} onClose={onClose}

}

function PacksPage() {

  const toast = useToast();
  const confirm = useConfirm();

  const savePack = p => {
    setPacks(prev => {
      const exists = prev.find(x=>x.id===p.id);
      const n = exists ? prev.map(x=>x.id===p.id?p:x) : [p,...prev];
      save('morrey_packs', n);
      return n;
    });
    toast('Pack guardado', 'success');
    setModal(null);
  };

  const deletePack = id => {
    confirm('¿Eliminar este pack?', () => {
      setPacks(prev => { const n=prev.filter(p=>p.id!==id); save('morrey_packs',n); return n; });
      toast('Pack eliminado', 'info');
    });
  };

  const toggle = id => {
    setPacks(prev => { const n=prev.map(p=>p.id===id?{...p,active:!p.active}:p); save('morrey_packs',n); return n; });
  };

  return (
    <div className="fade-in space-y-5">

        <EmptyState icon="fa-box-open" title="Sin packs" desc="Creá tus combos y promociones."
          action={<button className="btn btn-brand btn-sm" onClick={()=>setModal('new')}><i className="fas fa-plus"></i>Crear</button>} />
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {packs.map(p => (
            <div key={p.id} className={`card p-5 ${!p.active?'opacity-50':''}`}>

                  <i className="fas fa-box text-brand"></i>
                </div>

                    className={`text-xs px-2 py-1 rounded-lg font-medium ${p.active?'bg-green-500/10 text-green-400':'bg-white/5 text-gray-500'}`}>
                    {p.active?'Activo':'Inactivo'}
                  </button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setModal(p)}><i className="fas fa-pencil text-xs"></i></button>
                  <button className="btn btn-ghost btn-sm text-red-500" onClick={()=>deletePack(p.id)}><i className="fas fa-trash text-xs"></i></button>
                </div>
              </div>
              <h3 className="font-semibold text-sm mb-1">{p.name}</h3>
              {p.desc && <p className="text-xs text-gray-500 leading-relaxed mb-2">{p.desc}</p>}
              {p.price && <span className="text-brand font-bold text-sm">{p.price}</span>}
            </div>
          ))}
        </div>
      )}
      {modal && <PackModal pack={modal==='new'?null:modal} onClose={()=>setModal(null)} onSave={savePack} />}
    </div>
  );
}

function ConfigPage() {
  const [cfg, setCfg] = useState(() => ({...DEFAULT_CONFIG, ...load('morrey_config', {})}));

  const DAYS_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const set = (k,v) => setCfg(p=>({...p,[k]:v}));

  const saveCfg = () => {
    save('morrey_config', cfg);
    toast('Configuración guardada', 'success');
  };

  const toggleDay = d => {
    const days = cfg.availableDays.includes(d) ? cfg.availableDays.filter(x=>x!==d) : [...cfg.availableDays,d].sort();

  const changePw = () => {

function CajaPage({bookings, setBookings}) {
  const [period, setPeriod] = useState('month'); // today | week | month | year | all
  const [methodFilter, setMethodFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [editPayment, setEditPayment] = useState(null);
  const toast = useToast();

  const paid = bookings.filter(b => b.status === 'completed' && b.paymentStatus && b.paymentStatus !== 'unpaid');

  const inPeriod = (dateStr) => {
    if (!dateStr) return false;
    const d = new Date(dateStr.slice(0,10)+'T12:00:00');
    const now = new Date();
    if (period === 'today') return dateStr.slice(0,10) === today();
    if (period === 'week') {
      const start = new Date(now); start.setDate(now.getDate() - now.getDay() + 1); start.setHours(0,0,0,0);
      const end = new Date(start); end.setDate(start.getDate() + 6); end.setHours(23,59,59,999);
      return d >= start && d <= end;
    }
    if (period === 'month') return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
    if (period === 'year') return d.getFullYear()===now.getFullYear();
    return true;
  };

  const periodPaid = paid.filter(b => inPeriod(b.paymentDate || b.date));
  const totalIncome = periodPaid.reduce((s,b) => s + (Number(b.paymentAmount)||0), 0);
  const avgTicket = periodPaid.length ? totalIncome / periodPaid.length : 0;

  // All time stats
  const totalEver = paid.reduce((s,b)=>s+(Number(b.paymentAmount)||0),0);
  const todayIncome = paid.filter(b=>(b.paymentDate||b.date||'').slice(0,10)===today()).reduce((s,b)=>s+(Number(b.paymentAmount)||0),0);
  const now2 = new Date();
  const monthIncome = paid.filter(b=>{const d=new Date((b.paymentDate||b.date||'').slice(0,10)+'T12:00:00');return d.getMonth()===now2.getMonth()&&d.getFullYear()===now2.getFullYear();}).reduce((s,b)=>s+(Number(b.paymentAmount)||0),0);
  const yearIncome = paid.filter(b=>new Date((b.paymentDate||b.date||'').slice(0,10)+'T12:00:00').getFullYear()===now2.getFullYear()).reduce((s,b)=>s+(Number(b.paymentAmount)||0),0);

  // Method breakdown for period
  const byMethod = {};
  periodPaid.forEach(b => {
    const m = b.paymentMethod || 'Sin especificar';
    byMethod[m] = (byMethod[m]||0) + (Number(b.paymentAmount)||0);
  });

  // Filtered history
  const history = paid
    .filter(b => methodFilter==='all' || b.paymentMethod===methodFilter)
    .filter(b => !search || b.name?.toLowerCase().includes(search.toLowerCase()) || b.service?.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => (b.paymentDate||b.date||'') > (a.paymentDate||a.date||'') ? 1 : -1);

  const savePaymentEdit = async (updated) => {
    const { error } = await _db.from('bookings').update(toDbUpdate(updated)).eq('id', updated.id);
    if (error) { toast('Error al actualizar cobro', 'error'); return; }
    setBookings(prev => prev.map(b => b.id === updated.id ? updated : b));
    setEditPayment(null);
    toast('Cobro actualizado', 'success');
  };

  const periods = [
    {k:'today',label:'Hoy'},
    {k:'week',label:'Esta semana'},
    {k:'month',label:'Este mes'},
    {k:'year',label:'Este año'},
    {k:'all',label:'Todo'},
  ];

  const methodIcons = {'Efectivo':'fa-money-bill-wave','Transferencia':'fa-mobile-screen','Tarjeta débito':'fa-credit-card','Tarjeta crédito':'fa-credit-card','Otro':'fa-circle-dot'};

  return (
    <div className="fade-in space-y-6">
      <PageHeader title="Caja / Ingresos" subtitle="Registro de cobros y análisis financiero" />

      {/* Top KPIs — always all-time reference */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {[
          {label:'Hoy', value:todayIncome, icon:'fa-sun', color:'text-brand', bg:'bg-brand/10'},
          {label:'Este mes', value:monthIncome, icon:'fa-calendar', color:'text-blue-400', bg:'bg-blue-400/10'},
          {label:'Este año', value:yearIncome, icon:'fa-chart-line', color:'text-purple-400', bg:'bg-purple-400/10'},
          {label:'Total histórico', value:totalEver, icon:'fa-trophy', color:'text-orange-400', bg:'bg-orange-400/10'},
        ].map((s,i) => (
          <div key={i} className="stat-card">
            <div className={`w-10 h-10 rounded-xl ${s.bg} flex items-center justify-center mb-3`}>
              <i className={`fas ${s.icon} ${s.color}`}></i>
            </div>
            <div className="text-xl font-bold mb-0.5 tabular-nums">{fmtMoney(s.value)}</div>
            <div className="text-xs font-semibold text-gray-400">{s.label}</div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4">
        {/* Period analysis */}
        <div className="card p-5 lg:col-span-2">
          <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
            <h2 className="font-semibold text-sm text-gray-300 flex items-center gap-2">
              <i className="fas fa-chart-bar text-brand"></i> Análisis por período
            </h2>
            <div className="flex gap-1.5 flex-wrap">
              {periods.map(p => (
                <button key={p.k} onClick={()=>setPeriod(p.k)}
                  className={`pill-filter text-xs py-1 px-3 ${period===p.k?'active':''}`}>{p.label}</button>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-3 gap-3 mb-5">
            <div className="p-3 rounded-xl bg-white/3 border border-white/5">
              <div className="text-xs text-gray-500 mb-1">Ingresos</div>
              <div className="text-lg font-bold text-brand tabular-nums">{fmtMoney(totalIncome)}</div>
            </div>
            <div className="p-3 rounded-xl bg-white/3 border border-white/5">
              <div className="text-xs text-gray-500 mb-1">Cobros</div>
              <div className="text-lg font-bold tabular-nums">{periodPaid.length}</div>
            </div>
            <div className="p-3 rounded-xl bg-white/3 border border-white/5">
              <div className="text-xs text-gray-500 mb-1">Ticket prom.</div>
              <div className="text-lg font-bold tabular-nums">{fmtMoney(Math.round(avgTicket))}</div>
            </div>
          </div>
          {/* Method breakdown bars */}
          {Object.keys(byMethod).length > 0 && (
            <div>
              <p className="text-xs text-gray-600 uppercase tracking-wide font-semibold mb-3">Por método de pago</p>
              <div className="space-y-2.5">
                {Object.entries(byMethod).sort((a,b)=>b[1]-a[1]).map(([method, amount]) => {
                  const pct = totalIncome ? Math.round((amount/totalIncome)*100) : 0;
                  return (
                    <div key={method}>
                      <div className="flex justify-between text-xs mb-1">
                        <span className="text-gray-400 flex items-center gap-1.5">
                          <i className={`fas ${methodIcons[method]||'fa-circle-dot'} text-gray-600`}></i>{method}
                        </span>
                        <span className="text-gray-300 font-medium">{fmtMoney(amount)} <span className="text-gray-600">({pct}%)</span></span>
                      </div>
                      <div className="h-1.5 bg-white/5 rounded-full overflow-hidden">
                        <div className="h-full bg-brand rounded-full" style={{width:`${pct}%`,transition:'width .4s ease'}}></div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
          {Object.keys(byMethod).length === 0 && (
            <p className="text-sm text-gray-600 text-center py-4">Sin cobros en este período</p>
          )}
        </div>

        {/* Pending payments */}
        <div className="card p-5">
          <h2 className="font-semibold text-sm text-gray-300 mb-4 flex items-center gap-2">
            <i className="fas fa-hourglass-half text-orange-400"></i> Pendientes de cobro
          </h2>
          {(() => {
            const unpaid = bookings.filter(b => b.status==='completed' && (!b.paymentStatus || b.paymentStatus==='unpaid'));
            return unpaid.length === 0 ? (
              <div className="text-center py-6">
                <i className="fas fa-check-circle text-emerald-400 text-2xl mb-2"></i>
                <p className="text-sm text-gray-500">Todo cobrado</p>
              </div>
            ) : (
              <div className="space-y-2">
                {unpaid.slice(0,6).map(b => (
                  <div key={b.id} className="flex items-center gap-2 p-2.5 rounded-xl bg-white/2 hover:bg-white/4 transition-colors">
                    <div className="min-w-0 flex-1">
                      <div className="text-xs font-semibold truncate">{b.name}</div>
                      <div className="text-xs text-gray-600 truncate">{b.service}</div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <div className="text-xs text-gray-400">{fmtDate(b.date)}</div>
                      {b.priceEstimate && <div className="text-xs text-brand font-bold">{fmtMoney(b.priceEstimate)}</div>}
                    </div>
                  </div>
                ))}
                {unpaid.length > 6 && <p className="text-xs text-gray-600 text-center pt-1">+{unpaid.length-6} más</p>}
              </div>

        </div>
      </div>

      {/* History table */}
      <div className="card overflow-hidden">
        <div className="p-4 border-b border-[#1e1e1e] flex items-center gap-3 flex-wrap">
          <h2 className="font-semibold text-sm text-gray-300 flex items-center gap-2 mr-auto">
            <i className="fas fa-receipt text-brand"></i> Historial de cobros
            <span className="text-xs text-gray-600 font-normal">({paid.length} total)</span>
          </h2>
          <div className="relative">
            <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-xs"></i>
            <input className="input pl-8 text-sm py-2" style={{width:180}} placeholder="Buscar..." value={search} onChange={e=>setSearch(e.target.value)} />

          <select className="input text-sm py-2" style={{width:160}} value={methodFilter} onChange={e=>setMethodFilter(e.target.value)}>
            <option value="all">Todos los métodos</option>
            {PAYMENT_METHODS.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
        </div>
        {history.length === 0 ? (
          <EmptyState icon="fa-receipt" title="Sin cobros registrados" desc="Los cobros aparecerán aquí al finalizar turnos." />
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Fecha</th>
                  <th>Cliente</th>
                  <th className="hidden sm:table-cell">Servicio</th>
                  <th>Monto</th>
                  <th className="hidden md:table-cell">Método</th>
                  <th>Estado pago</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                {history.map(b => (
                  <tr key={b.id}>
                    <td className="text-sm text-gray-400 tabular-nums whitespace-nowrap">
                      {fmtDate((b.paymentDate||b.date||'').slice(0,10))}

                    <td>
                      <div className="text-sm font-medium">{b.name}</div>
                      {b.vehicle && <div className="text-xs text-gray-600">{b.vehicle}</div>}

                    <td className="hidden md:table-cell">

                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {editPayment && <PaymentModal turno={editPayment} onClose={()=>setEditPayment(null)} onSave={savePaymentEdit} />}
    </div>
  );
}

//  CALENDARIO PAGE
