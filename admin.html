<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morrey Detailing — Admin</title>
  <link rel="icon" href="logo.jpg" type="image/jpeg" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#ffde00', 'brand-d': '#c9af00' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <style>
    *{box-sizing:border-box}
    body{background:#080808;color:#fff;font-family:'Inter',sans-serif;margin:0;min-height:100vh}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:#111}
    ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#3a3a3a}
    .card{background:#111;border:1px solid #1e1e1e;border-radius:14px}
    .input{background:#161616;border:1px solid #252525;color:#fff;border-radius:9px;padding:10px 13px;width:100%;outline:none;font-family:inherit;font-size:14px;transition:border-color .15s}
    .input:focus{border-color:#ffde00}
    .input::placeholder{color:#444}
    select.input option{background:#161616}
    .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:14px;font-weight:600;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;transition:all .15s;white-space:nowrap}
    .btn-brand{background:#ffde00;color:#000}.btn-brand:hover{background:#c9af00}
    .btn-ghost{background:transparent;color:#aaa;border:1px solid #222}.btn-ghost:hover{border-color:#3a3a3a;color:#fff}
    .btn-red{background:#ef4444;color:#fff}.btn-red:hover{background:#dc2626}
    .btn-green{background:#22c55e;color:#000}.btn-green:hover{background:#16a34a}
    .btn-blue{background:#3b82f6;color:#fff}.btn-blue:hover{background:#2563eb}
    .btn-sm{padding:6px 12px;font-size:13px}
    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600}
    .nav-link{display:flex;align-items:center;gap:11px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:all .15s;font-size:14px;font-weight:500;color:#888;user-select:none}
    .nav-link:hover{background:rgba(255,222,0,.07);color:#ccc}
    .nav-link.active{background:rgba(255,222,0,.13);color:#ffde00}
    .nav-link.active i{color:#ffde00}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
    .modal{background:#111;border:1px solid #222;border-radius:16px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto}
    .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast-item{background:#161616;border:1px solid #2a2a2a;border-radius:11px;padding:12px 16px;display:flex;align-items:center;gap:10px;pointer-events:all;min-width:240px;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.6);animation:tin .2s ease}

    th{text-align:left;padding:11px 14px;color:#555;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a1a1a}
    td{padding:12px 14px;border-bottom:1px solid #141414;vertical-align:middle}
    tr:hover td{background:rgba(255,255,255,.02)}

    .star.empty{color:#2a2a2a}
    .pill-filter{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;border:1px solid #1e1e1e;background:#111;color:#777;transition:all .15s}
    .pill-filter:hover{border-color:#2e2e2e;color:#ccc}
    .pill-filter.active{background:rgba(255,222,0,.12);border-color:rgba(255,222,0,.3);color:#ffde00}
    .img-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;display:block}
    .sidebar-mobile-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:30;backdrop-filter:blur(2px)}
  </style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useContext, createContext, useCallback } = React;

// ═══════════════════════════════════════════
//  STORAGE & UTILS
// ═══════════════════════════════════════════
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const load = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { if (!d) return '—'; const [y,m,dy] = d.split('-'); return `${dy}/${m}/${y}`; };
const fmtDateLong = d => { if (!d) return '—'; const dt = new Date(d+'T12:00:00'); return dt.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}); };

// ═══════════════════════════════════════════
//  STATUS DEFINITIONS
// ═══════════════════════════════════════════
const STATUS = {
  pending:    { label:'Pendiente',   cls:'bg-yellow-500/15 text-yellow-400 border border-yellow-500/25', dot:'bg-yellow-400' },
  confirmed:  { label:'Confirmado',  cls:'bg-green-500/15 text-green-400 border border-green-500/25',   dot:'bg-green-400' },
  in_progress:{ label:'En proceso',  cls:'bg-blue-500/15 text-blue-400 border border-blue-500/25',      dot:'bg-blue-400' },
  completed:  { label:'Finalizado',  cls:'bg-purple-500/15 text-purple-400 border border-purple-500/25',dot:'bg-purple-400' },
  cancelled:  { label:'Cancelado',   cls:'bg-red-500/15 text-red-400 border border-red-500/25',         dot:'bg-red-400' },
};

// ═══════════════════════════════════════════
//  DEFAULTS
// ═══════════════════════════════════════════
const ICONS = ['fa-car-side','fa-couch','fa-cog','fa-sun','fa-shield-alt','fa-gem','fa-lightbulb','fa-spray-can','fa-water','fa-star','fa-wrench','fa-paint-brush'];

const DEFAULT_SERVICES = [
  {id:uid(),name:'Lavado Detallado Premium',desc:'Limpieza exterior e interior completa con productos premium.',price:'',duration:'2-3 hs',icon:'fa-car-side',active:true},
  {id:uid(),name:'Limpieza de Tapizados',desc:'Extracción profunda de suciedad en telas y cueros.',price:'',duration:'2-4 hs',icon:'fa-couch',active:true},
  {id:uid(),name:'Limpieza de Motor',desc:'Desengrasado y limpieza del compartimento motor.',price:'',duration:'1-2 hs',icon:'fa-cog',active:true},
  {id:uid(),name:'Abrillantado',desc:'Pulido y abrillantado para eliminar rayones leves.',price:'',duration:'3-5 hs',icon:'fa-sun',active:true},
  {id:uid(),name:'Tratamiento Acrílico',desc:'Protección con capa acrílica para mayor durabilidad.',price:'',duration:'4-6 hs',icon:'fa-shield-alt',active:true},
  {id:uid(),name:'Tratamiento Cerámico',desc:'Nano cerámica de alta duración y brillo extremo.',price:'',duration:'6-8 hs',icon:'fa-gem',active:true},
  {id:uid(),name:'Restauración de Ópticas',desc:'Pulido y restauración de faros opacos y amarillos.',price:'',duration:'1-2 hs',icon:'fa-lightbulb',active:true},
];

const DEFAULT_CONFIG = {
  whatsapp:'5491156359321',
  instagram:'morreydetailing',
  maxPerDay:4,
  availableDays:[1,2,3,4,5,6],
  weekdayStart:'09:00',weekdayEnd:'17:00',
  saturdayStart:'09:00',saturdayEnd:'13:00',
  reminderMsg:'Te recordamos tu turno mañana a las [hora]. ¡Te esperamos! — Morrey Detailing',
  confirmMsg:'Hola [nombre], tu turno está confirmado para el [dia] a las [hora]. ¡Gracias por elegirnos! — Morrey Detailing',
};

// ═══════════════════════════════════════════
//  TOAST CONTEXT
// ═══════════════════════════════════════════
const ToastCtx = createContext(null);
function ToastProvider({children}) {
  const [toasts, setToasts] = useState([]);
  const add = useCallback((msg, type='success') => {
    const id = uid();
    setToasts(p => [...p, {id, msg, type}]);
    setTimeout(() => setToasts(p => p.filter(t => t.id !== id)), 3500);
  }, []);
  const icons = {success:'fa-check-circle text-green-400', error:'fa-times-circle text-red-400', info:'fa-info-circle text-blue-400', warning:'fa-exclamation-circle text-yellow-400'};
  return (
    <ToastCtx.Provider value={add}>
      {children}
      <div className="toast-wrap">
        {toasts.map(t => (
          <div key={t.id} className="toast-item">
            <i className={`fas ${icons[t.type]||icons.info} text-lg`}></i>
            <span className="text-sm text-gray-200">{t.msg}</span>
            <button onClick={() => setToasts(p=>p.filter(x=>x.id!==t.id))} className="ml-auto text-gray-600 hover:text-gray-300 text-lg leading-none">&times;</button>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
const useToast = () => useContext(ToastCtx);

// ═══════════════════════════════════════════
//  CONFIRM DIALOG
// ═══════════════════════════════════════════
const ConfirmCtx = createContext(null);
function ConfirmProvider({children}) {
  const [state, setState] = useState(null);
  const confirm = useCallback((msg, onOk, opts={}) => setState({msg, onOk, opts}), []);
  const close = () => setState(null);
  return (
    <ConfirmCtx.Provider value={confirm}>
      {children}
      {state && (
        <div className="modal-bg" onClick={close}>
          <div className="card p-6 max-w-xs w-full text-center fade-in" onClick={e=>e.stopPropagation()}>
            <div className="w-12 h-12 rounded-full bg-red-500/15 flex items-center justify-center mx-auto mb-4">
              <i className="fas fa-exclamation-triangle text-red-400 text-xl"></i>
            </div>
            <p className="text-sm text-gray-300 mb-5 leading-relaxed">{state.msg}</p>
            <div className="flex gap-3 justify-center">
              <button className="btn btn-ghost flex-1" onClick={close}>Cancelar</button>
              <button className="btn btn-red flex-1" onClick={() => { state.onOk(); close(); }}>{state.opts.label||'Eliminar'}</button>
            </div>
          </div>
        </div>
      )}
    </ConfirmCtx.Provider>
  );
}
const useConfirm = () => useContext(ConfirmCtx);

// ═══════════════════════════════════════════
//  SHARED COMPONENTS
// ═══════════════════════════════════════════
function StatusBadge({status}) {
  const s = STATUS[status] || STATUS.pending;
  return <span className={`badge ${s.cls}`}><span className={`w-1.5 h-1.5 rounded-full ${s.dot} inline-block`}></span>{s.label}</span>;
}

function Stars({n, max=5, onChange}) {
  return (
    <div className="flex gap-1">
      {Array.from({length:max}).map((_,i) => (
        <i key={i} className={`fas fa-star ${i<n?'star':'star empty'} ${onChange?'cursor-pointer':''}`}
           onClick={() => onChange && onChange(i+1)}></i>
      ))}
    </div>
  );
}

function Modal({title, onClose, children, footer}) {
  useEffect(() => {
    const fn = e => e.key==='Escape' && onClose();
    document.addEventListener('keydown', fn);
    return () => document.removeEventListener('keydown', fn);
  }, [onClose]);
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal fade-in" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between p-5 border-b border-[#1e1e1e]">
          <h3 className="font-semibold text-base">{title}</h3>
          <button className="w-8 h-8 rounded-lg flex items-center justify-center text-gray-500 hover:text-white hover:bg-white/5 transition-colors" onClick={onClose}>
            <i className="fas fa-times"></i>
          </button>
        </div>
        <div className="p-5">{children}</div>
        {footer && <div className="p-5 border-t border-[#1e1e1e] flex justify-end gap-3">{footer}</div>}
      </div>
    </div>
  );
}

function EmptyState({icon, title, desc, action}) {
  return (
    <div className="flex flex-col items-center justify-center py-16 text-center px-4">
      <div className="w-14 h-14 rounded-2xl bg-white/4 flex items-center justify-center mb-4">
        <i className={`fas ${icon} text-2xl text-gray-600`}></i>
      </div>
      <p className="font-semibold text-gray-400 mb-1">{title}</p>
      <p className="text-sm text-gray-600 mb-5">{desc}</p>
      {action}
    </div>
  );
}

function FormField({label, children, required}) {
  return (
    <div className="flex flex-col gap-1.5">
      <label className="text-xs font-semibold text-gray-500 uppercase tracking-wide">{label}{required&&<span className="text-brand ml-1">*</span>}</label>
      {children}
    </div>
  );
}

function PageHeader({title, subtitle, action}) {
  return (
    <div className="flex items-start justify-between gap-4 mb-6">
      <div>
        <h1 className="text-xl font-bold">{title}</h1>
        {subtitle && <p className="text-sm text-gray-500 mt-0.5">{subtitle}</p>}
      </div>
      {action}
    </div>
  );
}

// ═══════════════════════════════════════════
//  TIME SLOTS
// ═══════════════════════════════════════════
function getTimeSlots(dateStr, config) {
  if (!dateStr) return [];
  const dt = new Date(dateStr + 'T12:00:00');
  const dow = dt.getDay();
  if (!config.availableDays.includes(dow)) return [];
  const isSat = dow === 6;
  const start = isSat ? config.saturdayStart : config.weekdayStart;
  const end   = isSat ? config.saturdayEnd   : config.weekdayEnd;
  const slots = [];
  let [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  while (sh * 60 + sm < eh * 60 + em) {
    slots.push(`${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}`);
    sm += 60; if (sm >= 60) { sh++; sm -= 60; }
  }
  return slots;
}

// ═══════════════════════════════════════════
//  LOGIN PAGE
// ═══════════════════════════════════════════
function LoginPage({onLogin}) {
  const [pw, setPw] = useState('');
  const [show, setShow] = useState(false);
  const [err, setErr] = useState('');
  const [loading, setLoading] = useState(false);
  const toast = useToast();

  const submit = (e) => {
    e.preventDefault();
    const stored = load('morrey_admin_pw', 'morrey2025');
    if (pw === stored) {
      setLoading(true);
      setTimeout(() => { onLogin(); toast('Bienvenido al panel admin', 'success'); }, 500);
    } else {
      setErr('Contraseña incorrecta');
      setTimeout(() => setErr(''), 2000);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{background:'radial-gradient(ellipse at 50% 0%,rgba(255,222,0,.06) 0%,transparent 60%)'}}>
      <div className="card p-8 w-full max-w-sm text-center fade-in" style={{border:'1px solid rgba(255,222,0,.15)'}}>
        <img src="logo.jpg" alt="Morrey Detailing" className="h-16 w-auto object-contain mx-auto mb-5 rounded-lg" />
        <h1 className="text-lg font-bold mb-1">Panel Administrativo</h1>
        <p className="text-sm text-gray-500 mb-7">Morrey Detailing</p>
        <form onSubmit={submit} className="flex flex-col gap-4">
          <div className="relative">
            <input className="input pr-10" type={show?'text':'password'} placeholder="Contraseña" value={pw}
              onChange={e=>{setPw(e.target.value);setErr('')}} autoFocus />
            <button type="button" onClick={()=>setShow(!show)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors">
              <i className={`fas ${show?'fa-eye-slash':'fa-eye'} text-sm`}></i>
            </button>
          </div>
          {err && <p className="text-red-400 text-xs -mt-2">{err}</p>}
          <button type="submit" className="btn btn-brand justify-center py-2.5" disabled={loading}>
            {loading ? <i className="fas fa-circle-notch fa-spin"></i> : <><i className="fas fa-sign-in-alt"></i> Ingresar</>}
          </button>
        </form>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════
//  DASHBOARD
// ═══════════════════════════════════════════
function Dashboard({bookings, clients, services}) {
  const todayStr = today();
  const todayBookings = bookings.filter(b => b.date === todayStr);
  const weekBookings = bookings.filter(b => {
    if (!b.date) return false;
    const d = new Date(b.date+'T12:00:00'); const now = new Date();
    const start = new Date(now); start.setDate(now.getDate() - now.getDay() + 1);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return d >= start && d <= end;
  });
  const pending = bookings.filter(b => b.status === 'pending').length;
  const vips = clients.filter(c => c.isVIP).length;

  const svcCount = {};
  bookings.forEach(b => { svcCount[b.service] = (svcCount[b.service]||0) + 1; });
  const topSvc = Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const upcoming = bookings
    .filter(b => b.date >= todayStr && b.status !== 'cancelled')
    .sort((a,b) => (a.date+a.time) > (b.date+b.time) ? 1 : -1)
    .slice(0, 5);

  const stats = [
    {icon:'fa-calendar-day', label:'Turnos hoy', value:todayBookings.length, sub:`${todayBookings.filter(b=>b.status==='confirmed').length} confirmados`, color:'text-brand', bg:'bg-brand/10'},
    {icon:'fa-calendar-week', label:'Esta semana', value:weekBookings.length, sub:`${weekBookings.filter(b=>b.status==='pending').length} pendientes`, color:'text-blue-400', bg:'bg-blue-400/10'},
    {icon:'fa-users', label:'Clientes', value:clients.length, sub:`${vips} VIP`, color:'text-purple-400', bg:'bg-purple-400/10'},
    {icon:'fa-clock', label:'Por confirmar', value:pending, sub:'turnos pendientes', color:'text-orange-400', bg:'bg-orange-400/10'},
  ];

  return (
    <div className="fade-in space-y-6">
      <div>
        <h1 className="text-xl font-bold">Dashboard</h1>
        <p className="text-sm text-gray-500 mt-0.5">{new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
      </div>

      {/* Stat Cards */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {stats.map((s,i) => (
          <div key={i} className="stat-card">
            <div className={`w-10 h-10 rounded-xl ${s.bg} flex items-center justify-center mb-3`}>
              <i className={`fas ${s.icon} ${s.color}`}></i>
            </div>
            <div className="text-2xl font-bold mb-0.5">{s.value}</div>
            <div className="text-xs font-semibold text-gray-400">{s.label}</div>
            <div className="text-xs text-gray-600 mt-0.5">{s.sub}</div>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
        {/* Próximos turnos */}
        <div className="card p-5 lg:col-span-3">
          <h2 className="font-semibold text-sm text-gray-300 mb-4 flex items-center gap-2">
            <i className="fas fa-calendar-alt text-brand"></i> Próximos turnos
          </h2>
          {upcoming.length === 0 ? (
            <p className="text-sm text-gray-600 text-center py-6">No hay turnos próximos</p>
          ) : (
            <div className="space-y-2">
              {upcoming.map(b => (
                <div key={b.id} className="flex items-center gap-3 p-3 rounded-xl bg-white/2 hover:bg-white/4 transition-colors">
                  <div className="w-9 h-9 rounded-xl bg-brand/10 flex-shrink-0 flex items-center justify-center">
                    <i className="fas fa-user text-brand text-xs"></i>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-semibold truncate">{b.name}</div>
                    <div className="text-xs text-gray-500 truncate">{b.service}</div>
                  </div>
                  <div className="text-right flex-shrink-0">
                    <div className="text-xs font-semibold text-gray-300">{fmtDate(b.date)}</div>
                    {b.time && <div className="text-xs text-gray-600">{b.time}</div>}
                  </div>
                  <StatusBadge status={b.status} />
                </div>
              ))}
            </div>
          )}
        </div>

        {/* Servicios más solicitados */}
        <div className="card p-5 lg:col-span-2">
          <h2 className="font-semibold text-sm text-gray-300 mb-4 flex items-center gap-2">
            <i className="fas fa-chart-bar text-brand"></i> Más solicitados
          </h2>
          {topSvc.length === 0 ? (
            <p className="text-sm text-gray-600 text-center py-6">Sin datos aún</p>
          ) : (
            <div className="space-y-3">
              {topSvc.map(([name, count], i) => {
                const max = topSvc[0][1];
                return (
                  <div key={name}>
                    <div className="flex justify-between text-xs mb-1">
                      <span className="text-gray-400 truncate mr-2">{name}</span>
                      <span className="text-brand font-bold flex-shrink-0">{count}</span>
                    </div>
                    <div className="h-1.5 bg-white/5 rounded-full overflow-hidden">
                      <div className="h-full bg-brand rounded-full transition-all" style={{width:`${(count/max)*100}%`}}></div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
          <div className="divider mt-5 mb-4"></div>
          <h2 className="font-semibold text-sm text-gray-300 mb-3 flex items-center gap-2">
            <i className="fas fa-fire text-orange-400"></i> Estado hoy
          </h2>
          {['pending','confirmed','in_progress','completed'].map(s => {
            const cnt = todayBookings.filter(b=>b.status===s).length;
            return cnt > 0 ? (
              <div key={s} className="flex items-center justify-between py-1.5">
                <StatusBadge status={s} />
                <span className="text-sm font-bold">{cnt}</span>
              </div>
            ) : null;
          })}
          {todayBookings.length === 0 && <p className="text-xs text-gray-600">Sin turnos hoy</p>}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════
//  TURNO MODAL (crear / editar)
// ═══════════════════════════════════════════
function TurnoModal({turno, onClose, onSave, services, bookings, config}) {
  const isEdit = !!turno?.id;
  const [form, setForm] = useState({
    name:'', phone:'', email:'', vehicle:'', service:'', date:'', time:'', status:'pending', notes:'',
    ...(turno||{})
  });
  const toast = useToast();
  const set = (k, v) => setForm(p => ({...p, [k]:v}));

  const slots = getTimeSlots(form.date, config);
  const takenSlots = bookings
    .filter(b => b.date === form.date && b.status !== 'cancelled' && b.id !== form.id)
    .map(b => b.time);

  const save = () => {
    if (!form.name.trim()) return toast('Ingresá el nombre del cliente', 'error');
    if (!form.service) return toast('Seleccioná un servicio', 'error');
    if (!form.date) return toast('Seleccioná una fecha', 'error');
    if (!form.time) return toast('Seleccioná un horario', 'error');
    onSave({...form, id: form.id||uid(), createdAt: form.createdAt||new Date().toISOString()});
  };

  const activeServices = services.filter(s => s.active);

  return (
    <Modal title={isEdit ? 'Editar turno' : 'Nuevo turno'} onClose={onClose}
      footer={<><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-brand" onClick={save}><i className="fas fa-save"></i>{isEdit?'Guardar':'Crear turno'}</button></>}>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <FormField label="Nombre" required>
          <input className="input" value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ej: Juan García" />
        </FormField>
        <FormField label="Teléfono">
          <input className="input" value={form.phone} onChange={e=>set('phone',e.target.value)} placeholder="Ej: 1156359321" />
        </FormField>
        <FormField label="Email">
          <input className="input" value={form.email} onChange={e=>set('email',e.target.value)} placeholder="email@ejemplo.com" />
        </FormField>
        <FormField label="Vehículo">
          <input className="input" value={form.vehicle} onChange={e=>set('vehicle',e.target.value)} placeholder="Ej: VW Gol 2019 blanco" />
        </FormField>
        <FormField label="Servicio" required>
          <select className="input" value={form.service} onChange={e=>set('service',e.target.value)}>
            <option value="">Seleccionar...</option>
            {activeServices.map(s => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </FormField>
        <FormField label="Estado">
          <select className="input" value={form.status} onChange={e=>set('status',e.target.value)}>
            {Object.entries(STATUS).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
          </select>
        </FormField>
        <FormField label="Fecha" required>
          <input className="input" type="date" value={form.date} onChange={e=>{set('date',e.target.value);set('time','')}} />
        </FormField>
        <FormField label="Horario" required>
          {slots.length === 0 ? (
            <div className="input text-gray-600 text-sm">{form.date ? 'Sin turnos disponibles' : 'Elegí una fecha primero'}</div>
          ) : (
            <select className="input" value={form.time} onChange={e=>set('time',e.target.value)}>
              <option value="">Seleccionar...</option>
              {slots.map(t => (
                <option key={t} value={t} disabled={takenSlots.includes(t)}>
                  {t}{takenSlots.includes(t) ? ' — ocupado' : ''}
                </option>
              ))}
            </select>
          )}
        </FormField>
        <div className="sm:col-span-2">
          <FormField label="Notas internas">
            <textarea className="input" value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="Observaciones, detalles del trabajo..." />
          </FormField>
        </div>
      </div>
    </Modal>
  );
}

// ═══════════════════════════════════════════
//  TURNOS PAGE
// ═══════════════════════════════════════════
function TurnosPage({bookings, setBookings, services, config}) {
  const [filter, setFilter] = useState('all');
  const [dateFilter, setDateFilter] = useState('');
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null); // null | 'new' | turno
  const toast = useToast();
  const confirm = useConfirm();

  const filtered = bookings
    .filter(b => filter==='all' || b.status===filter)
    .filter(b => !dateFilter || b.date===dateFilter)
    .filter(b => !search || b.name?.toLowerCase().includes(search.toLowerCase()) || b.phone?.includes(search) || b.vehicle?.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => (a.date+a.time) > (b.date+b.time) ? -1 : 1);

  const saveTurno = (t) => {
    setBookings(prev => {
      const exists = prev.find(b=>b.id===t.id);
      const next = exists ? prev.map(b=>b.id===t.id?t:b) : [t,...prev];
      save('morrey_bookings', next);
      return next;
    });
    toast(t.id&&bookings.find(b=>b.id===t.id) ? 'Turno actualizado' : 'Turno creado', 'success');
    setModal(null);
  };

  const deleteTurno = (id) => {
    confirm('¿Eliminar este turno? Esta acción no se puede deshacer.', () => {
      setBookings(prev => { const n=prev.filter(b=>b.id!==id); save('morrey_bookings',n); return n; });
      toast('Turno eliminado', 'info');
    });
  };

  const changeStatus = (id, status) => {
    setBookings(prev => { const n=prev.map(b=>b.id===id?{...b,status}:b); save('morrey_bookings',n); return n; });
    toast(`Estado actualizado a "${STATUS[status].label}"`, 'success');
  };

  const sendWA = (b) => {
    const cfg = load('morrey_config', DEFAULT_CONFIG);
    const dayStr = fmtDateLong(b.date);
    const msg = cfg.confirmMsg
      .replace('[nombre]', b.name||'')
      .replace('[dia]', dayStr)
      .replace('[hora]', b.time||'');
    const phone = b.phone?.replace(/\D/g,'');
    window.open(`https://wa.me/54${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  const sendReminder = (b) => {
    const cfg = load('morrey_config', DEFAULT_CONFIG);
    const msg = cfg.reminderMsg.replace('[hora]', b.time||'');
    const phone = b.phone?.replace(/\D/g,'');
    window.open(`https://wa.me/54${phone}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  const tabs = [
    {k:'all',label:'Todos',count:bookings.length},
    {k:'pending',label:'Pendientes',count:bookings.filter(b=>b.status==='pending').length},
    {k:'confirmed',label:'Confirmados',count:bookings.filter(b=>b.status==='confirmed').length},
    {k:'in_progress',label:'En proceso',count:bookings.filter(b=>b.status==='in_progress').length},
    {k:'completed',label:'Finalizados',count:bookings.filter(b=>b.status==='completed').length},
    {k:'cancelled',label:'Cancelados',count:bookings.filter(b=>b.status==='cancelled').length},
  ];

  return (
    <div className="fade-in space-y-5">
      <PageHeader title="Gestión de Turnos" subtitle={`${bookings.length} turnos en total`}
        action={<button className="btn btn-brand" onClick={()=>setModal('new')}><i className="fas fa-plus"></i><span className="hidden sm:inline">Nuevo turno</span></button>} />

      {/* Filters */}
      <div className="card p-4 space-y-3">
        <div className="flex gap-2 overflow-x-auto pb-1 -mb-1 scrollbar-hide">
          {tabs.map(t => (
            <button key={t.k} onClick={()=>setFilter(t.k)} className={`pill-filter flex-shrink-0 ${filter===t.k?'active':''}`}>
              {t.label}
              {t.count>0 && <span className={`ml-1 text-xs px-1.5 py-0.5 rounded-full ${filter===t.k?'bg-brand/20 text-brand':'bg-white/5 text-gray-500'}`}>{t.count}</span>}
            </button>
          ))}
        </div>
        <div className="flex gap-3">
          <div className="relative flex-1">
            <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-600 text-sm"></i>
            <input className="input pl-9" placeholder="Buscar por nombre, teléfono, vehículo..." value={search} onChange={e=>setSearch(e.target.value)} />
          </div>
          <input className="input w-40" type="date" value={dateFilter} onChange={e=>setDateFilter(e.target.value)} />
          {(dateFilter||search) && <button className="btn btn-ghost btn-sm" onClick={()=>{setDateFilter('');setSearch('')}}>Limpiar</button>}
        </div>
      </div>

      {/* List */}
      {filtered.length === 0 ? (
        <EmptyState icon="fa-calendar-times" title="Sin turnos" desc="No hay turnos que coincidan con los filtros."
          action={<button className="btn btn-brand btn-sm" onClick={()=>setModal('new')}><i className="fas fa-plus"></i>Crear turno</button>} />
      ) : (
        <div className="space-y-3">
          {filtered.map(b => (
            <div key={b.id} className="card p-4 hover:border-[#2a2a2a] transition-colors">
              <div className="flex items-start gap-3">
                <div className="w-10 h-10 rounded-xl bg-brand/10 flex-shrink-0 flex items-center justify-center">
                  <i className="fas fa-user text-brand text-sm"></i>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className="font-semibold text-sm">{b.name}</span>
                    <StatusBadge status={b.status} />
                  </div>
                  <div className="flex items-center gap-3 flex-wrap mt-1">
                    {b.phone && <span className="text-xs text-gray-500 flex items-center gap-1"><i className="fas fa-phone"></i>{b.phone}</span>}
                    {b.vehicle && <span className="text-xs text-gray-500 flex items-center gap-1"><i className="fas fa-car"></i>{b.vehicle}</span>}
                  </div>
                  <div className="flex items-center gap-3 flex-wrap mt-1.5">
                    <span className="text-xs text-gray-400 flex items-center gap-1"><i className="fas fa-wrench text-gray-600"></i>{b.service||'—'}</span>
                    <span className="text-xs text-gray-400 flex items-center gap-1"><i className="fas fa-calendar text-gray-600"></i>{fmtDate(b.date)}{b.time&&` — ${b.time}`}</span>
                  </div>
                  {b.notes && <p className="text-xs text-gray-600 mt-1.5 italic">"{b.notes}"</p>}
                </div>
              </div>
              {/* Actions */}
              <div className="flex gap-2 flex-wrap mt-3 pt-3 border-t border-[#1a1a1a]">
                <select className="input text-xs py-1.5 px-2 w-auto flex-shrink-0 h-8"
                  value={b.status} onChange={e=>changeStatus(b.id,e.target.value)}>
                  {Object.entries(STATUS).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                </select>
                {b.phone && (
                  <button className="btn btn-green btn-sm" onClick={()=>sendWA(b)} title="Enviar WhatsApp">
                    <i className="fab fa-whatsapp"></i><span className="hidden sm:inline">WhatsApp</span>
                  </button>
                )}
                {b.phone && b.date && (
                  <button className="btn btn-ghost btn-sm" onClick={()=>sendReminder(b)} title="Enviar recordatorio">
                    <i className="fas fa-bell"></i><span className="hidden sm:inline">Recordar</span>
                  </button>
                )}
                <button className="btn btn-ghost btn-sm ml-auto" onClick={()=>setModal(b)}>
                  <i className="fas fa-pencil"></i>
                </button>
                <button className="btn btn-ghost btn-sm text-red-500 hover:text-red-400" onClick={()=>deleteTurno(b.id)}>
                  <i className="fas fa-trash"></i>
                </button>
              </div>
            </div>
          ))}
        </div>
      )}

      {modal && (
        <TurnoModal turno={modal==='new'?null:modal} onClose={()=>setModal(null)}
          onSave={saveTurno} services={services} bookings={bookings} config={config} />
      )}
    </div>
  );
}

function ClientesPage({clients, setClients, bookings}) {
  const [search, setSearch] = useState('');

  const [detail, setDetail] = useState(null);
  const [vipOnly, setVipOnly] = useState(false);
  const toast = useToast();
  const confirm = useConfirm();

  const filtered = clients
    .filter(c => !vipOnly || c.isVIP)
    .filter(c => !search || c.name?.toLowerCase().includes(search.toLowerCase()) || c.phone?.includes(search) || c.vehicle?.toLowerCase().includes(search.toLowerCase()))
    .sort((a,b) => a.name?.localeCompare(b.name));

  const saveCliente = c => {
    setClients(prev => {
      const exists = prev.find(x=>x.id===c.id);
      const n = exists ? prev.map(x=>x.id===c.id?c:x) : [c,...prev];
      save('morrey_clients', n);
      return n;
    });
    toast('Cliente guardado', 'success');
    setModal(null);
  };

  const deleteCliente = id => {
    confirm('¿Eliminar este cliente?', () => {
      setClients(prev => { const n=prev.filter(c=>c.id!==id); save('morrey_clients',n); return n; });
      toast('Cliente eliminado', 'info');
      if (detail?.id===id) setDetail(null);
    });
  };

  const clientBookings = c => bookings.filter(b => b.name===c.name || b.phone===c.phone).sort((a,b)=>b.date>a.date?1:-1);

  if (detail) {
    const cb = clientBookings(detail);
    return (
      <div className="fade-in space-y-5">
        <div className="flex items-center gap-3">
          <button className="btn btn-ghost btn-sm" onClick={()=>setDetail(null)}><i className="fas fa-arrow-left"></i></button>

            <h1 className="text-xl font-bold flex items-center gap-2">{detail.name}{detail.isVIP&&<span className="badge bg-brand/20 text-brand border border-brand/30 text-xs">⭐ VIP</span>}</h1>
            <p className="text-sm text-gray-500">Perfil del cliente</p>
          </div>
          <div className="ml-auto flex gap-2">
            <button className="btn btn-ghost btn-sm" onClick={()=>setModal(detail)}><i className="fas fa-pencil"></i></button>
            <button className="btn btn-ghost btn-sm text-red-500" onClick={()=>deleteCliente(detail.id)}><i className="fas fa-trash"></i></button>
          </div>
        </div>
        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div className="card p-5 sm:col-span-1">
            <div className="w-14 h-14 rounded-2xl bg-brand/10 flex items-center justify-center mb-4 text-2xl">
              {detail.isVIP ? '⭐' : <i className="fas fa-user text-brand"></i>}
            </div>
            <div className="space-y-3">
              {detail.phone && <div><p className="text-xs text-gray-600">Teléfono</p><p className="text-sm font-medium">{detail.phone}</p></div>}
              {detail.email && <div><p className="text-xs text-gray-600">Email</p><p className="text-sm font-medium">{detail.email}</p></div>}
              {detail.vehicle && <div><p className="text-xs text-gray-600">Vehículo</p><p className="text-sm font-medium">{detail.vehicle}</p></div>}

              <button className="btn btn-green btn-sm w-full mt-4" onClick={()=>window.open(`https://wa.me/54${detail.phone.replace(/\D/g,'')}`)}>

    </div>
  );

function ServicioModal({svc, onClose, onSave}) {
  const [form, setForm] = useState({name:'',desc:'',price:'',duration:'',icon:'fa-car-side',active:true,...(svc||{})});
  const toast = useToast();

function GaleriaPage() {
  const [hidden, setHidden] = useState(() => load('morrey_hidden_gallery', []));
  const [extras, setExtras] = useState(() => load('morrey_extra_gallery', []));
  const [featured, setFeatured] = useState(() => load('morrey_featured_gallery', []));
  const fileRef = useRef();
  const toast = useToast();
  const confirm = useConfirm();

  const builtIn = Array.from({length:34}, (_,i) => `${i+1}.jpg`);

  const toggleHidden = name => {
    const n = hidden.includes(name) ? hidden.filter(h=>h!==name) : [...hidden, name];
    setHidden(n); save('morrey_hidden_gallery', n);
    toast(hidden.includes(name) ? 'Imagen visible' : 'Imagen oculta', 'info');
  };

  const toggleFeatured = name => {
    const n = featured.includes(name) ? featured.filter(f=>f!==name) : [...featured, name];
    setFeatured(n); save('morrey_featured_gallery', n);
  };

  const deleteExtra = id => {
    confirm('¿Eliminar esta imagen?', () => {
      const n = extras.filter(e=>e.id!==id);
      setExtras(n); save('morrey_extra_gallery', n);
      toast('Imagen eliminada', 'info');
    });
  };

  const upload = e => {
    const files = Array.from(e.target.files);
    files.forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => {
        const item = {id:uid(), src:ev.target.result, name:f.name, addedAt:new Date().toISOString()};
        setExtras(prev => { const n=[...prev,item]; save('morrey_extra_gallery',n); return n; });
        toast('Imagen subida', 'success');
      };
      reader.readAsDataURL(f);
    });
    e.target.value = '';
  };

  return (
    <div className="fade-in space-y-5">
      <PageHeader title="Galería" subtitle={`${builtIn.length - hidden.length} visibles · ${extras.length} subidas`}
        action={<><input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={upload} /><button className="btn btn-brand" onClick={()=>fileRef.current.click()}><i className="fas fa-upload"></i><span className="hidden sm:inline">Subir fotos</span></button></>} />

      {extras.length > 0 && (
        <div>
          <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Fotos subidas ({extras.length})</h2>
          <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
            {extras.map(img => (
              <div key={img.id} className="relative group">
                <img src={img.src} alt={img.name} className="img-thumb" />
                <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex items-center justify-center gap-2">
                  <button onClick={()=>deleteExtra(img.id)} className="w-7 h-7 rounded-lg bg-red-500 text-white flex items-center justify-center">
                    <i className="fas fa-trash text-xs"></i>
                  </button>
                </div>
                <span className="absolute top-1 right-1 text-xs bg-brand text-black px-1.5 py-0.5 rounded font-bold">Nueva</span>
              </div>
            ))}
          </div>
          <div className="divider my-5"></div>
        </div>
      )}

      <div>
        <h2 className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3">Fotos del sitio ({builtIn.length})</h2>
        <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3">
          {builtIn.map(name => {
            const isHidden = hidden.includes(name);
            const isFeat = featured.includes(name);
            return (
              <div key={name} className={`relative group ${isHidden?'opacity-30':''}`}>
                <img src={`Images/${name}`} alt={name} className="img-thumb" onError={e=>e.target.style.display='none'} />
                <div className="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl flex flex-col items-center justify-center gap-1.5 p-1">
                  <button onClick={()=>toggleHidden(name)}
                    className={`text-xs px-2 py-1 rounded-lg font-semibold transition-colors ${isHidden?'bg-brand text-black':'bg-white/10 text-white'}`}>
                    {isHidden ? 'Mostrar' : 'Ocultar'}
                  </button>
                  <button onClick={()=>toggleFeatured(name)}
                    className={`text-xs px-2 py-1 rounded-lg font-semibold transition-colors ${isFeat?'bg-yellow-400 text-black':'bg-white/10 text-white'}`}>
                    {isFeat ? '⭐ Dest.' : 'Destacar'}
                  </button>
                </div>
                {isFeat && <span className="absolute top-1 left-1 text-xs">⭐</span>}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ConfigPage() {
  const [cfg, setCfg] = useState(() => ({...DEFAULT_CONFIG, ...load('morrey_config', {})}));
  const [pw, setPw] = useState({current:'',next:'',confirm:''});
  const [pwErr, setPwErr] = useState('');
  const toast = useToast();
  const DAYS_NAMES = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const set = (k,v) => setCfg(p=>({...p,[k]:v}));

  const saveCfg = () => {
    save('morrey_config', cfg);
    toast('Configuración guardada', 'success');
  };

  const toggleDay = d => {
    const days = cfg.availableDays.includes(d) ? cfg.availableDays.filter(x=>x!==d) : [...cfg.availableDays,d].sort();
    set('availableDays', days);
  };

  const changePw = () => {
    const stored = load('morrey_admin_pw', 'morrey2025');
    if (pw.current !== stored) { setPwErr('Contraseña actual incorrecta'); return; }
    if (pw.next.length < 6) { setPwErr('Mínimo 6 caracteres'); return; }
    if (pw.next !== pw.confirm) { setPwErr('Las contraseñas no coinciden'); return; }
    save('morrey_admin_pw', pw.next);
    setPw({current:'',next:'',confirm:''});
    setPwErr('');
    toast('Contraseña actualizada', 'success');
  };

  return (
    <div className="fade-in space-y-6 max-w-2xl">
      <PageHeader title="Configuración" subtitle="Ajustes generales del negocio" />

        </FormField>
        <FormField label="Días disponibles">
          <div className="flex gap-2 flex-wrap">
            {DAYS_NAMES.map((d,i) => (
              <button key={i} type="button" onClick={()=>toggleDay(i)}
                className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${cfg.availableDays.includes(i)?'bg-brand text-black':'bg-white/5 text-gray-400 hover:bg-white/8'}`}>
                {d}
              </button>
            ))}
          </div>
        </FormField>
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
          <FormField label="Semana — apertura"><input className="input" type="time" value={cfg.weekdayStart} onChange={e=>set('weekdayStart',e.target.value)} /></FormField>
          <FormField label="Semana — cierre"><input className="input" type="time" value={cfg.weekdayEnd} onChange={e=>set('weekdayEnd',e.target.value)} /></FormField>
          <FormField label="Sábado — apertura"><input className="input" type="time" value={cfg.saturdayStart} onChange={e=>set('saturdayStart',e.target.value)} /></FormField>
          <FormField label="Sábado — cierre"><input className="input" type="time" value={cfg.saturdayEnd} onChange={e=>set('saturdayEnd',e.target.value)} /></FormField>
        </div>
        <button className="btn btn-brand" onClick={saveCfg}><i className="fas fa-save"></i> Guardar configuración</button>
      </div>

      <div className="card p-6 space-y-5">
        <h2 className="font-semibold flex items-center gap-2"><i className="fab fa-whatsapp text-green-400"></i> Mensajes WhatsApp</h2>

          <textarea className="input" value={cfg.confirmMsg} onChange={e=>set('confirmMsg',e.target.value)} />
        </FormField>
        <FormField label="Mensaje de recordatorio">
          <textarea className="input" value={cfg.reminderMsg} onChange={e=>set('reminderMsg',e.target.value)} />
        </FormField>
        <button className="btn btn-brand" onClick={saveCfg}><i className="fas fa-save"></i> Guardar mensajes</button>
      </div>

      <div className="card p-6 space-y-4">
        <h2 className="font-semibold flex items-center gap-2"><i className="fas fa-lock text-gray-400"></i> Cambiar contraseña</h2>
        <div className="space-y-3 max-w-sm">
          <FormField label="Contraseña actual"><input className="input" type="password" value={pw.current} onChange={e=>setPw(p=>({...p,current:e.target.value}))} /></FormField>
          <FormField label="Nueva contraseña"><input className="input" type="password" value={pw.next} onChange={e=>setPw(p=>({...p,next:e.target.value}))} /></FormField>
          <FormField label="Confirmar nueva contraseña"><input className="input" type="password" value={pw.confirm} onChange={e=>setPw(p=>({...p,confirm:e.target.value}))} /></FormField>
          {pwErr && <p className="text-red-400 text-xs">{pwErr}</p>}
          <button className="btn btn-ghost" onClick={changePw}><i className="fas fa-key"></i> Cambiar contraseña</button>
        </div>
      </div>

      <div className="card p-6 border-red-500/20">
        <h2 className="font-semibold flex items-center gap-2 text-red-400 mb-4"><i className="fas fa-exclamation-triangle"></i> Zona peligrosa</h2>
        <div className="flex flex-wrap gap-3">
          <button className="btn btn-red btn-sm" onClick={()=>{
            if(confirm('¿Eliminar TODOS los turnos?')) { save('morrey_bookings',[]); toast('Todos los turnos eliminados','warning'); }
          }}><i className="fas fa-trash"></i> Borrar todos los turnos</button>
          <button className="btn btn-ghost btn-sm" onClick={()=>window.location.href='index.html'}>
            <i className="fas fa-home"></i> Ver sitio principal
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════
const NAV = [
  {id:'dashboard', icon:'fa-gauge', label:'Dashboard'},
  {id:'turnos',    icon:'fa-calendar-check', label:'Turnos'},
  {id:'clientes',  icon:'fa-users', label:'Clientes'},
  {id:'servicios', icon:'fa-wrench', label:'Servicios'},
  {id:'galeria',   icon:'fa-images', label:'Galería'},
  {id:'testimonios',icon:'fa-star', label:'Testimonios'},
  {id:'packs',     icon:'fa-box-open', label:'Packs'},
  {id:'config',    icon:'fa-sliders', label:'Configuración'},
];

function Sidebar({page, setPage, onClose, pendingCount}) {
  return (
    <aside className="flex flex-col h-full" style={{background:'#0b0b0b'}}>
      {/* Logo */}
      <div className="flex items-center gap-3 px-5 py-5 border-b border-[#161616]">
        <img src="logo.jpg" alt="Logo" className="w-9 h-9 rounded-lg object-cover" onError={e=>e.target.style.display='none'} />
        <div>
          <div className="font-bold text-sm leading-none">Morrey</div>
          <div className="text-xs text-gray-600">Detailing Admin</div>
        </div>
        {onClose && (
          <button onClick={onClose} className="ml-auto text-gray-600 hover:text-white transition-colors lg:hidden">
            <i className="fas fa-times"></i>
          </button>
        )}
      </div>
      {/* Nav */}
      <nav className="flex-1 p-3 space-y-0.5 overflow-y-auto">
        {NAV.map(n => (
          <div key={n.id} className={`nav-link ${page===n.id?'active':''}`}
            onClick={() => { setPage(n.id); onClose && onClose(); }}>
            <i className={`fas ${n.icon} w-4 text-center text-sm`}></i>
            <span>{n.label}</span>
            {n.id==='turnos' && pendingCount > 0 && (
              <span className="ml-auto bg-brand text-black text-xs font-bold px-1.5 py-0.5 rounded-full">{pendingCount}</span>
            )}
          </div>
        ))}
      </nav>
      {/* Footer */}
      <div className="p-4 border-t border-[#161616]">
        <a href="index.html" className="nav-link text-xs">
          <i className="fas fa-globe w-4 text-center text-sm"></i>
          <span>Ver sitio</span>
          <i className="fas fa-arrow-up-right-from-square text-xs ml-auto opacity-40"></i>
        </a>
      </div>
    </aside>
  );
}

// ═══════════════════════════════════════════
//  TOPBAR
// ═══════════════════════════════════════════
function TopBar({page, onMenuClick, onLogout, bookings}) {
  const [showNotif, setShowNotif] = useState(false);
  const todayStr = today();
  const newToday = bookings.filter(b => b.date === todayStr && b.status === 'pending');
  const label = NAV.find(n=>n.id===page)?.label || page;

  return (
    <header className="flex items-center gap-3 px-4 py-3 border-b border-[#161616] sticky top-0 z-20" style={{background:'#0a0a0a'}}>
      <button className="lg:hidden w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-colors" onClick={onMenuClick}>
        <i className="fas fa-bars"></i>
      </button>
      <h2 className="font-semibold text-sm">{label}</h2>
      <div className="ml-auto flex items-center gap-2">
        {/* Notifications */}
        <div className="relative">
          <button onClick={()=>setShowNotif(!showNotif)}
            className="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-colors relative">
            <i className="fas fa-bell"></i>
            {newToday.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-brand rounded-full"></span>}
          </button>
          {showNotif && (
            <div className="absolute right-0 top-full mt-2 w-72 card p-3 z-50 shadow-2xl fade-in">
              <p className="text-xs font-semibold text-gray-500 uppercase mb-2">Turnos de hoy</p>
              {newToday.length === 0 ? (
                <p className="text-xs text-gray-600 py-2 text-center">Sin turnos pendientes hoy</p>
              ) : newToday.map(b => (
                <div key={b.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-white/3 transition-colors">
                  <div className="w-7 h-7 rounded-full bg-brand/10 flex items-center justify-center flex-shrink-0">
                    <i className="fas fa-user text-brand text-xs"></i>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-xs font-medium truncate">{b.name}</div>
                    <div className="text-xs text-gray-600 truncate">{b.service} — {b.time||'sin hora'}</div>
                  </div>
                </div>
              ))}
              <button onClick={()=>setShowNotif(false)} className="w-full mt-2 text-xs text-gray-600 hover:text-gray-400 transition-colors py-1">Cerrar</button>
            </div>
          )}
        </div>
        <button onClick={onLogout}
          className="w-9 h-9 rounded-lg flex items-center justify-center text-gray-500 hover:text-red-400 hover:bg-red-500/5 transition-colors" title="Salir">
          <i className="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>
  );
}

// ═══════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════
function App() {
  const [auth, setAuth] = useState(() => sessionStorage.getItem('morrey_auth') === '1');
  const [page, setPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Global state
  const [bookings, setBookings]   = useState(() => load('morrey_bookings', []));
  const [clients,  setClients]    = useState(() => load('morrey_clients', []));
  const [services, setServices]   = useState(() => {
    const s = load('morrey_services', null);
    if (!s) { save('morrey_services', DEFAULT_SERVICES); return DEFAULT_SERVICES; }
    return s;
  });
  const config = {...DEFAULT_CONFIG, ...load('morrey_config', {})};

  // Notification sound on new pending booking
  const prevBookingsLen = useRef(bookings.length);
  useEffect(() => {
    const interval = setInterval(() => {
      const fresh = load('morrey_bookings', []);
      if (fresh.length > prevBookingsLen.current) {
        prevBookingsLen.current = fresh.length;
        setBookings(fresh);
        try { new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAA...').play().catch(()=>{}); } catch {}
      }
    }, 10000);
    return () => clearInterval(interval);
  }, []);

  const login = () => { sessionStorage.setItem('morrey_auth','1'); setAuth(true); };
  const logout = () => { sessionStorage.removeItem('morrey_auth'); setAuth(false); };

  const pendingCount = bookings.filter(b=>b.status==='pending').length;

  if (!auth) return <LoginPage onLogin={login} />;

  const pages = {
    dashboard: <Dashboard bookings={bookings} clients={clients} services={services} />,
    turnos:    <TurnosPage bookings={bookings} setBookings={setBookings} services={services} config={config} />,
    clientes:  <ClientesPage clients={clients} setClients={setClients} bookings={bookings} />,
    servicios: <ServiciosPage services={services} setServices={setServices} />,
    galeria:   <GaleriaPage />,
    testimonios:<TestimoniosPage />,
    packs:     <PacksPage />,
    config:    <ConfigPage />,
  };

  return (
    <div className="flex h-screen overflow-hidden">
      {/* Desktop sidebar */}
      <div className="hidden lg:flex flex-col w-56 flex-shrink-0 border-r border-[#161616]">
        <Sidebar page={page} setPage={setPage} pendingCount={pendingCount} />
      </div>

      {/* Mobile sidebar overlay */}
      {sidebarOpen && (
        <div className="lg:hidden">
          <div className="sidebar-mobile-overlay" onClick={()=>setSidebarOpen(false)}></div>
          <div className="fixed left-0 top-0 h-full w-56 z-40 border-r border-[#161616] flex flex-col fade-in">
            <Sidebar page={page} setPage={setPage} pendingCount={pendingCount} onClose={()=>setSidebarOpen(false)} />
          </div>
        </div>
      )}

      {/* Main content */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        <TopBar page={page} onMenuClick={()=>setSidebarOpen(true)} onLogout={logout} bookings={bookings} />
        <main className="flex-1 overflow-y-auto p-4 lg:p-6">
          <div className="max-w-5xl mx-auto">
            {pages[page] || pages.dashboard}
          </div>
        </main>
      </div>
    </div>
  );
}

// Bootstrap
ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider>
    <ConfirmProvider>
      <App />
    </ConfirmProvider>
  </ToastProvider>
);
</script>
</body>
</html>
