function CalendarioPage({bookings, setPage}) {
  const todayStr = today();
  const [cur, setCur] = useState(() => {
    const d = new Date(); return {y: d.getFullYear(), m: d.getMonth()};
  });
  const [selectedDay, setSelectedDay] = useState(null); // 'YYYY-MM-DD'

  const DAYS_ES  = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MONTHS_ES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  const prevMonth = () => setCur(p => p.m === 0 ? {y:p.y-1,m:11} : {y:p.y,m:p.m-1});
  const nextMonth = () => setCur(p => p.m ===11 ? {y:p.y+1,m:0}  : {y:p.y,m:p.m+1});
  const goToday   = () => { const d=new Date(); setCur({y:d.getFullYear(),m:d.getMonth()}); setSelectedDay(todayStr); };

  // Build calendar grid (42 cells = 6 weeks)
  const firstDay  = new Date(cur.y, cur.m, 1).getDay();   // 0=Dom
  const daysInMonth = new Date(cur.y, cur.m+1, 0).getDate();
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = i - firstDay + 1;
    if (d < 1 || d > daysInMonth) { cells.push(null); continue; }
    const pad = n => String(n).padStart(2,'0');
    cells.push(`${cur.y}-${pad(cur.m+1)}-${pad(d)}`);
  }
  // Remove trailing empty rows
  while (cells.length > 7 && cells.slice(-7).every(c => c === null)) cells.splice(-7);

  // Bookings grouped by date
  const byDate = {};
  bookings.forEach(b => {
    if (!b.date) return;
    if (!byDate[b.date]) byDate[b.date] = [];
    byDate[b.date].push(b);
  });

  // Status color for a day
  const dayDot = (dateStr) => {
    const list = byDate[dateStr] || [];
    if (!list.length) return null;
    const active = list.filter(b => b.status !== 'cancelled');
    if (!active.length) return '#555';
    if (active.some(b => b.status === 'pending'))     return '#facc15';
    if (active.some(b => b.status === 'confirmed'))   return '#4ade80';
    if (active.some(b => b.status === 'in_progress')) return '#60a5fa';
    if (active.every(b => b.status === 'completed'))  return '#a78bfa';
    return '#facc15';
  };

  const selectedBookings = selectedDay ? (byDate[selectedDay] || []) : [];

  return (
    <div className="fade-in space-y-5">
      <PageHeader title="Calendario" subtitle="Visualizá tus turnos por día" />

      <div className="card p-5">
        {/* Month nav */}
        <div className="flex items-center justify-between mb-5">
          <button className="btn btn-ghost btn-sm" onClick={prevMonth}><i className="fas fa-chevron-left text-xs"></i></button>
          <div className="flex items-center gap-3">
            <h2 className="font-bold text-base">{MONTHS_ES[cur.m]} {cur.y}</h2>
            <button className="btn btn-ghost btn-sm text-xs" onClick={goToday}>Hoy</button>
          </div>
          <button className="btn btn-ghost btn-sm" onClick={nextMonth}><i className="fas fa-chevron-right text-xs"></i></button>
        </div>

        {/* Day headers */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3,marginBottom:3}}>
          {DAYS_ES.map(d => (
            <div key={d} style={{textAlign:'center',fontSize:11,fontWeight:600,color:'#555',padding:'4px 0',textTransform:'uppercase',letterSpacing:.5}}>
              {d}
            </div>
          ))}
        </div>

        {/* Calendar grid */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:3}}>
          {cells.map((dateStr, i) => {
            if (!dateStr) return <div key={i} />;
            const list   = byDate[dateStr] || [];
            const active = list.filter(b => b.status !== 'cancelled');
            const dot    = dayDot(dateStr);
            const isToday    = dateStr === todayStr;
            const isSelected = dateStr === selectedDay;
            const isPast     = dateStr < todayStr;
            return (
              <button key={dateStr} onClick={() => setSelectedDay(dateStr === selectedDay ? null : dateStr)}
                style={{
                  borderRadius: 10,
                  padding: '8px 4px',
                  border: isSelected ? '1px solid rgba(255,222,0,.5)' : isToday ? '1px solid rgba(255,222,0,.25)' : '1px solid transparent',
                  background: isSelected ? 'rgba(255,222,0,.1)' : isToday ? 'rgba(255,222,0,.05)' : 'transparent',
                  cursor: 'pointer',
                  display: 'flex',
                  flexDirection: 'column',
                  alignItems: 'center',
                  gap: 4,
                  minHeight: 52,
                  transition: 'all .12s',
                }}>
                <span style={{fontSize:13, fontWeight: isToday?700:400, color: isPast&&!isToday&&!isSelected?'#444':'#ccc'}}>
                  {Number(dateStr.slice(8))}
                </span>
                {active.length > 0 && (
                  <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
                    <span style={{width:7,height:7,borderRadius:'50%',background:dot,display:'block',flexShrink:0}}></span>
                    <span style={{fontSize:9,fontWeight:700,color:dot}}>{active.length}</span>
                  </div>
                )}
              </button>
            );
          })}
        </div>

        {/* Leyenda */}
        <div style={{display:'flex',gap:16,marginTop:16,flexWrap:'wrap'}}>
          {[
            {color:'#facc15',label:'Pendiente'},
            {color:'#4ade80',label:'Confirmado'},
            {color:'#60a5fa',label:'En proceso'},
            {color:'#a78bfa',label:'Finalizado'},
          ].map(l => (
            <div key={l.label} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'#555'}}>
              <span style={{width:7,height:7,borderRadius:'50%',background:l.color,display:'inline-block'}}></span>
              {l.label}
            </div>
          ))}
        </div>
      </div>

      {/* Detalle del día seleccionado */}
      {selectedDay && (
        <div className="card p-5 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h3 className="font-semibold text-sm">
              {new Date(selectedDay+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}
            </h3>
            {selectedBookings.length === 0 && (
              <button className="btn btn-brand btn-sm" onClick={() => setPage('turnos')}>
                <i className="fas fa-plus"></i> Agregar turno
              </button>
            )}
          </div>
          {selectedBookings.length === 0 ? (
            <p className="text-sm text-gray-600 text-center py-6">No hay turnos para este día.</p>
          ) : (
            <div className="space-y-3">
              {selectedBookings
                .sort((a,b) => (a.time||'') > (b.time||'') ? 1 : -1)
                .map(b => (
                  <div key={b.id} className={`flex items-start gap-3 p-3 rounded-xl border ${b.status==='cancelled'?'opacity-40':''}`}
                    style={{background:'#161616',borderColor:'#222'}}>
                    <div className="flex-shrink-0 mt-0.5">
                      <span style={{fontSize:12,fontWeight:700,color:'#ffde00',background:'rgba(255,222,0,.1)',border:'1px solid rgba(255,222,0,.2)',borderRadius:7,padding:'3px 8px',display:'block',minWidth:44,textAlign:'center'}}>
                        {b.time || '—'}
                      </span>
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className="font-semibold text-sm">{b.name}</span>
                        <StatusBadge status={b.status} />
                      </div>
                      <div className="flex gap-3 flex-wrap mt-0.5">
                        {b.service && <span className="text-xs text-gray-500"><i className="fas fa-wrench mr-1 text-gray-600"></i>{b.service}</span>}
                        {b.vehicle && <span className="text-xs text-gray-500"><i className="fas fa-car mr-1 text-gray-600"></i>{b.vehicle}</span>}
                        {b.phone   && <span className="text-xs text-gray-500"><i className="fas fa-phone mr-1 text-gray-600"></i>{b.phone}</span>}
                      </div>
                      {b.notes && <p className="text-xs text-gray-600 mt-1 italic">"{b.notes}"</p>}
                    </div>
                  </div>
                ))}
              <button className="btn btn-ghost btn-sm w-full" onClick={() => setPage('turnos')}>
                <i className="fas fa-list mr-1"></i> Ver todos los turnos
              </button>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════
//  SIDEBAR
// ═══════════════════════════════════════════
const NAV = [
  {id:'dashboard',   icon:'fa-gauge',          label:'Dashboard'},
  {id:'calendario',  icon:'fa-calendar-days',  label:'Calendario'},
  {id:'turnos',      icon:'fa-calendar-check', label:'Turnos'},
  {id:'caja',        icon:'fa-dollar-sign',    label:'Caja'},
  {id:'clientes',    icon:'fa-users',          label:'Clientes'},
  {id:'servicios',   icon:'fa-wrench',         label:'Servicios'},
  {id:'galeria',     icon:'fa-images',         label:'Galería'},
  {id:'testimonios', icon:'fa-star',           label:'Testimonios'},
  {id:'packs',       icon:'fa-box-open',       label:'Packs'},
  {id:'config',      icon:'fa-sliders',        label:'Configuración'},
];

function Sidebar({page, setPage, onClose, pendingCount, pendingTestimonials}) {
  return (
    <aside className="flex flex-col h-full" style={{background:'#0b0b0b'}}>
      {/* Logo */}
      <div className="flex items-center gap-3 px-5 py-5 border-b border-[#161616]">
        <img src="logo.png" alt="Logo" className="w-9 h-9 rounded-lg object-cover" onError={e=>e.target.style.display='none'} />
        <div>
          <div className="font-bold text-sm leading-none">Morrey</div>
          <div className="text-xs text-gray-600">Detailing Admin</div>
        </div>
        {onClose && (
          <button onClick={onClose} className="ml-auto text-gray-600 hover:text-white transition-colors lg:hidden">
            <i className="fas fa-times"></i>
          </button>
        )}
      </div>
      {/* Nav */}
      <nav className="flex-1 p-3 space-y-0.5 overflow-y-auto">
        {NAV.map(n => (
          <div key={n.id} className={`nav-link ${page===n.id?'active':''}`}
            onClick={() => { setPage(n.id); onClose && onClose(); }}>
            <i className={`fas ${n.icon} w-4 text-center text-sm`}></i>
            <span>{n.label}</span>
            {n.id==='turnos' && pendingCount > 0 && (
              <span className="ml-auto bg-brand text-black text-xs font-bold px-1.5 py-0.5 rounded-full">{pendingCount}</span>
            )}
            {n.id==='testimonios' && pendingTestimonials > 0 && (
              <span className="ml-auto bg-yellow-500 text-black text-xs font-bold px-1.5 py-0.5 rounded-full">{pendingTestimonials}</span>
            )}
          </div>
        ))}
      </nav>
      {/* Footer */}
      <div className="p-4 border-t border-[#161616]">
        <a href="index.html" className="nav-link text-xs">
          <i className="fas fa-globe w-4 text-center text-sm"></i>
          <span>Ver sitio</span>
          <i className="fas fa-arrow-up-right-from-square text-xs ml-auto opacity-40"></i>
        </a>
      </div>
    </aside>
  );
}

// ═══════════════════════════════════════════
//  TOPBAR
// ═══════════════════════════════════════════
function TopBar({page, onMenuClick, onLogout, bookings}) {
  const [showNotif, setShowNotif] = useState(false);
  const todayStr = today();
  const newToday = bookings.filter(b => b.date === todayStr && b.status === 'pending');
  const label = NAV.find(n=>n.id===page)?.label || page;

  return (
    <header className="flex items-center gap-3 px-4 py-3 border-b border-[#161616] sticky top-0 z-20" style={{background:'#0a0a0a'}}>
      <button className="lg:hidden w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-colors" onClick={onMenuClick}>
        <i className="fas fa-bars"></i>
      </button>
      <h2 className="font-semibold text-sm">{label}</h2>
      <div className="ml-auto flex items-center gap-2">
        {/* Notifications */}
        <div className="relative">
          <button onClick={()=>setShowNotif(!showNotif)}
            className="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/5 transition-colors relative">
            <i className="fas fa-bell"></i>
            {newToday.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-brand rounded-full"></span>}
          </button>
          {showNotif && (
            <div className="absolute right-0 top-full mt-2 w-72 card p-3 z-50 shadow-2xl fade-in">
              <p className="text-xs font-semibold text-gray-500 uppercase mb-2">Turnos de hoy</p>
              {newToday.length === 0 ? (
                <p className="text-xs text-gray-600 py-2 text-center">Sin turnos pendientes hoy</p>
              ) : newToday.map(b => (
                <div key={b.id} className="flex items-center gap-2 p-2 rounded-lg hover:bg-white/3 transition-colors">
                  <div className="w-7 h-7 rounded-full bg-brand/10 flex items-center justify-center flex-shrink-0">
                    <i className="fas fa-user text-brand text-xs"></i>
                  </div>
                  <div className="min-w-0 flex-1">
                    <div className="text-xs font-medium truncate">{b.name}</div>
                    <div className="text-xs text-gray-600 truncate">{b.service} — {b.time||'sin hora'}</div>
                  </div>
                </div>
              ))}
              <button onClick={()=>setShowNotif(false)} className="w-full mt-2 text-xs text-gray-600 hover:text-gray-400 transition-colors py-1">Cerrar</button>
            </div>
          )}
        </div>
        <button onClick={onLogout}
          className="w-9 h-9 rounded-lg flex items-center justify-center text-gray-500 hover:text-red-400 hover:bg-red-500/5 transition-colors" title="Salir">
          <i className="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>
  );
}

// ═══════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════
function App() {
  const [auth, setAuth] = useState(() => sessionStorage.getItem('morrey_auth') === '1');
  const [page, setPage] = useState('dashboard');
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Global state
  const [bookings,     setBookings]     = useState([]);
  const [bookingsLoading, setBookingsLoading] = useState(true);
  const toast = useToast();
  const [clients,      setClients]      = useState(() => load('morrey_clients', []));
  const [testimonials, setTestimonials] = useState(() => {
    const saved = load('morrey_testimonials', null);
    if (saved !== null) return saved;
    // Primera vez: sembrar los testimonios por defecto como publicados
    const defaults = [
      { id:uid(), name:'Martín G.',    vehicle:'Toyota Corolla', rating:5, comment:'Llevé el auto bastante deteriorado y quedó impecable. El cerámico que le aplicaron es increíble, el agua se va sola. Profesionalismo total.',                     status:'published', featured:true,  source:'default', createdAt:'2024-01-01T00:00:00.000Z' },
      { id:uid(), name:'Valentina R.', vehicle:'VW Vento',       rating:5, comment:'La limpieza de tapizados dejó el interior como nuevo. Manchas que parecían imposibles de sacar desaparecieron. Muy recomendable.',                                   status:'published', featured:false, source:'default', createdAt:'2024-01-02T00:00:00.000Z' },
      { id:uid(), name:'Lucas P.',     vehicle:'Ford Mustang',   rating:5, comment:'El resultado del abrillantado superó todas mis expectativas. Se nota que cuidan cada detalle y que aman lo que hacen. Vuelvo sin dudas.',                          status:'published', featured:false, source:'default', createdAt:'2024-01-03T00:00:00.000Z' },
    ];
    save('morrey_testimonials', defaults);
    return defaults;
  });
  const [services, setServices] = useState(() => {
    const s = load('morrey_services', null);
    if (!s) { save('morrey_services', DEFAULT_SERVICES); return DEFAULT_SERVICES; }
    return s;
  });
  const config = {...DEFAULT_CONFIG, ...load('morrey_config', {})};

  // Cargar turnos desde Supabase + Realtime para detectar nuevos del sitio público
  useEffect(() => {
    if (!_db) { setBookingsLoading(false); return; }

    // Carga inicial
    _db.from('bookings').select('*').order('created_at', {ascending: false})
      .then(({data, error}) => {
        if (data) setBookings(data.map(fromDb));
        if (error) toast('Error al cargar turnos desde Supabase', 'error');
        setBookingsLoading(false);
      });

    // Suscripción Realtime: nuevo turno del sitio público
    const channel = _db.channel('bookings-realtime')
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'bookings'}, ({new: row}) => {
        setBookings(prev => prev.some(b => b.id === row.id) ? prev : [fromDb(row), ...prev]);
        toast(`Nuevo turno: ${row.name} — ${row.service}`, 'info');
      })
      .subscribe();

    return () => _db.removeChannel(channel);
  }, []);

  const login = () => { sessionStorage.setItem('morrey_auth','1'); setAuth(true); };
  const logout = () => { sessionStorage.removeItem('morrey_auth'); setAuth(false); };

  const pendingCount = bookings.filter(b=>b.status==='pending').length;
  const pendingTestimonials = testimonials.filter(t=>!t.status||t.status==='pending').length;

  if (!auth) return <LoginPage onLogin={login} />;

  const pages = {
    dashboard:  <Dashboard bookings={bookings} clients={clients} services={services} />,
    calendario: <CalendarioPage bookings={bookings} setPage={setPage} />,
    turnos:     <TurnosPage bookings={bookings} setBookings={setBookings} services={services} config={config} clients={clients} setClients={setClients} />,
    caja:       <CajaPage bookings={bookings} setBookings={setBookings} />,
    clientes:   <ClientesPage clients={clients} setClients={setClients} bookings={bookings} />,
    servicios:  <ServiciosPage services={services} setServices={setServices} />,
    galeria:    <GaleriaPage />,
    testimonios:<TestimoniosPage items={testimonials} setItems={setTestimonials} services={services} />,
    packs:      <PacksPage />,
    config:     <ConfigPage />,
  };

  return (
    <div className="flex h-screen overflow-hidden">
      {/* Desktop sidebar */}
      <div className="hidden lg:flex flex-col w-56 flex-shrink-0 border-r border-[#161616]">
        <Sidebar page={page} setPage={setPage} pendingCount={pendingCount} pendingTestimonials={pendingTestimonials} />
      </div>

      {/* Mobile sidebar overlay */}
      {sidebarOpen && (
        <div className="lg:hidden">
          <div className="sidebar-mobile-overlay" onClick={()=>setSidebarOpen(false)}></div>
          <div className="fixed left-0 top-0 h-full w-56 z-40 border-r border-[#161616] flex flex-col fade-in">
            <Sidebar page={page} setPage={setPage} pendingCount={pendingCount} pendingTestimonials={pendingTestimonials} onClose={()=>setSidebarOpen(false)} />
          </div>
        </div>
      )}

      {/* Main content */}
      <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
        <TopBar page={page} onMenuClick={()=>setSidebarOpen(true)} onLogout={logout} bookings={bookings} />
        <main className="flex-1 overflow-y-auto p-4 lg:p-6">
          {!_db && (
            <div className="mb-4 flex items-start gap-3 p-4 rounded-xl bg-yellow-500/10 border border-yellow-500/25 text-yellow-300 text-sm">
              <i className="fas fa-triangle-exclamation flex-shrink-0 mt-0.5"></i>
              <div>
                <strong>Supabase no configurado.</strong> Editá <code className="bg-black/30 px-1 rounded">supabase-config.js</code> con tu URL y anon key para activar la base de datos real. Seguí las instrucciones dentro del archivo.
              </div>
            </div>
          )}
          {bookingsLoading && (
            <div className="flex items-center gap-2 text-xs text-gray-500 mb-4">
              <i className="fas fa-circle-notch fa-spin text-brand"></i>
              Cargando turnos desde Supabase...
            </div>
          )}
          <div className="max-w-5xl mx-auto">
            {pages[page] || pages.dashboard}
          </div>
        </main>
      </div>
    </div>
  );
}

// Bootstrap
ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider>
    <ConfirmProvider>
      <App />
    </ConfirmProvider>
  </ToastProvider>
);
</script>
</body>
</html>
