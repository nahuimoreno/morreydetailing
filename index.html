    function getAvailableTimes(dateStr) {
      if (!dateStr) return [];

    /* =============================================

    function useScrolled(threshold = 40) {
      const [v, setV] = useState(false);
      useEffect(() => {
        const fn = () => setV(window.scrollY > threshold);
        window.addEventListener('scroll', fn, { passive: true });
        return () => window.removeEventListener('scroll', fn);
      }, [threshold]);
      return v;
    }

    function useReveal(delay = 0) {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        if (delay) el.style.transitionDelay = `${delay}ms`;
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) { el.classList.add('on'); obs.unobserve(el); }
        }, { threshold: 0.1 });
        obs.observe(el);
        return () => obs.disconnect();
      }, [delay]);
      return ref;
    }

    function Gallery() {
      const titleRef  = useReveal();
      const stripRef  = useRef(null);
      const [lightbox, setLightbox] = useState(null); // null | number index

      // Build image list: built-in filtered by hidden/deleted + uploaded extras
      const allImgs = (() => {
        try {
          const hidden  = JSON.parse(localStorage.getItem('morrey_hidden_gallery')  || '[]');
          const deleted = JSON.parse(localStorage.getItem('morrey_deleted_gallery') || '[]');
          const extras  = JSON.parse(localStorage.getItem('morrey_extra_gallery')   || '[]');
          const builtin = GALLERY
            .filter(n => !hidden.includes(n) && !deleted.includes(n))
            .map(n => ({src:n, alt:`Trabajo ${n}`}));
          const uploaded = extras.map(e => ({src:e.src, alt:e.name}));
          return [...builtin, ...uploaded];
        } catch {
          return GALLERY.map(n => ({src:n, alt:`Trabajo ${n}`}));
        }
      })();

      // Lightbox keyboard nav
      useEffect(() => {
        if (lightbox === null) return;
        const fn = e => {
          if (e.key === 'ArrowRight') setLightbox(i => (i + 1) % allImgs.length);
          if (e.key === 'ArrowLeft')  setLightbox(i => (i - 1 + allImgs.length) % allImgs.length);
          if (e.key === 'Escape')     setLightbox(null);
        };
        window.addEventListener('keydown', fn);
        return () => window.removeEventListener('keydown', fn);
      }, [lightbox]);

      const scrollStrip = dir => {
        if (stripRef.current) stripRef.current.scrollBy({ left: dir * 280, behavior: 'smooth' });

        <>

                  <i className="fas fa-chevron-left text-sm"></i>

                  {allImgs.map((img, i) => (
                    <div key={i}
                      style={{flexShrink:0,width:220,height:280,scrollSnapAlign:'start',borderRadius:12,overflow:'hidden',cursor:'pointer',border:'1px solid rgba(255,255,255,.06)',position:'relative'}}

                      <div style={{position:'absolute',inset:0,background:'linear-gradient(to top,rgba(0,0,0,.55),transparent)',opacity:0,transition:'opacity .3s',display:'flex',alignItems:'flex-end',justifyContent:'center',paddingBottom:12}}
                        className="group-hover:opacity-100">
                        <i className="fas fa-expand text-white/80 text-sm"></i>
                      </div>
                    </div>
                  ))}
                </div>

                {/* Right arrow */}
                <button className="carousel-arrow" onClick={() => scrollStrip(1)}
                  style={{position:'absolute',right:-20,top:'50%',transform:'translateY(-50%)',zIndex:10,background:'rgba(10,10,10,.9)',border:'1px solid rgba(255,255,255,.1)',color:'#fff',width:42,height:42,borderRadius:21,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(8px)',transition:'border-color .2s'}}>
                  <i className="fas fa-chevron-right text-sm"></i>
                </button>
              </div>

              <p className="text-center text-white/20 text-xs mt-5">
                Deslizá para ver más · tocá cualquier foto para ampliar
              </p>

              {/* CTA galería */}
              <div className="text-center mt-10">
                <p className="text-white/50 text-sm mb-4">¿Querés este resultado para tu auto?</p>
                <button onClick={() => goTo('turnos')}
                  className="inline-flex items-center gap-2 px-7 py-3.5 bg-brand text-black font-bold rounded-xl hover:bg-brand-dark transition-all hover:-translate-y-px text-sm">
                  <i className="fas fa-calendar-check"></i>
                  Reservar mi turno ahora
                </button>
              </div>
            </div>
          </section>

          {/* Lightbox */}
          {lightbox !== null && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.96)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}
              onClick={() => setLightbox(null)}>
              {/* Prev */}
              <button onClick={e=>{e.stopPropagation();setLightbox(i=>(i-1+allImgs.length)%allImgs.length)}}
                style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',background:'rgba(255,255,255,.12)',border:'1px solid rgba(255,255,255,.15)',color:'#fff',width:50,height:50,borderRadius:25,cursor:'pointer',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',backdropFilter:'blur(8px)'}}>

              </button>

              <button onClick={()=>setLightbox(null)}

                <i className="fas fa-times"></i>
              </button>
              {/* Counter */}
              <div style={{position:'absolute',bottom:18,left:'50%',transform:'translateX(-50%)',color:'rgba(255,255,255,.4)',fontSize:12,letterSpacing:1}}>
                {lightbox + 1} / {allImgs.length}

            </div>

        </>
      );
    }

    function getPublishedTestimonials() {
      try {
        const all = JSON.parse(localStorage.getItem('morrey_testimonials') || '[]');
        const published = all.filter(t => t.status === 'published');
        if (published.length === 0) return null; // fall back to hardcoded
        // Featured first
        return [...published].sort((a,b) => {
          if (a.featured && !b.featured) return -1;
          if (!a.featured && b.featured) return 1;
          return (b.createdAt||'') > (a.createdAt||'') ? 1 : -1;
        }).slice(0, 6);
      } catch { return null; }
    }

    function TestimonialForm({ onSuccess }) {
      const [form, setForm] = useState({ name:'', comment:'', rating:5, service:'', vehicle:'', photo:null });
      const [preview, setPreview] = useState(null);
      const [errors, setErrors] = useState({});
      const [loading, setLoading] = useState(false);
      const fileRef = useRef();

      const set = (k, v) => { setForm(p=>({...p,[k]:v})); setErrors(p=>({...p,[k]:null})); };

      const uploadPhoto = e => {
        const f = e.target.files[0]; if (!f) return;
        const allowed = ['image/jpeg','image/png','image/webp'];
        if (!allowed.includes(f.type)) { setErrors(p=>({...p,photo:'Solo JPG, PNG o WebP'})); return; }
        if (f.size > 5*1024*1024) { setErrors(p=>({...p,photo:'Máximo 5 MB'})); return; }
        const reader = new FileReader();
        reader.onload = ev => { set('photo', ev.target.result); setPreview(ev.target.result); };
        reader.readAsDataURL(f);
        e.target.value = '';
      };

      const submit = e => {
        e.preventDefault();
        const errs = {};
        if (!form.name.trim()) errs.name = 'El nombre es obligatorio';
        if (!form.comment.trim()) errs.comment = 'El comentario es obligatorio';
        if (form.comment.length > 500) errs.comment = 'Máximo 500 caracteres';
        if (Object.keys(errs).length) { setErrors(errs); return; }
        setLoading(true);
        setTimeout(() => {
          try {
            const mkId = () => Date.now().toString(36) + Math.random().toString(36).slice(2);
            const all = JSON.parse(localStorage.getItem('morrey_testimonials') || '[]');
            all.push({
              id: mkId(), name: form.name.trim(), comment: form.comment.trim(),
              rating: form.rating, service: form.service.trim(), vehicle: form.vehicle.trim(),
              photo: form.photo, showPhoto: true,
              status: 'pending', featured: false, source: 'web',
              createdAt: new Date().toISOString(),
            });
            localStorage.setItem('morrey_testimonials', JSON.stringify(all));
            setLoading(false);
            onSuccess();
          } catch { setLoading(false); }
        }, 700);
      };

      const charLeft = 500 - (form.comment?.length||0);

      const inputBase = "w-full bg-[#0d0d0d] border border-white/[.08] rounded-xl px-4 py-3 text-sm text-white placeholder-white/20 outline-none focus:border-brand/50 transition-colors font-sans";

      return (
        <section id="dejar-resena" className="py-20 bg-[#080808]">
          <div className="max-w-xl mx-auto px-5 md:px-8">
            <div className="text-center mb-10">
              <span className="text-brand text-[11px] font-semibold tracking-widest uppercase">Tu opinión importa</span>
              <h3 className="text-3xl font-black mt-3">Dejá tu reseña</h3>
              <p className="text-white/40 text-sm mt-2">Tu testimonio será revisado antes de publicarse.</p>
            </div>
            <form onSubmit={submit} className="space-y-4">
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <input className={inputBase} placeholder="Tu nombre *" value={form.name} onChange={e=>set('name',e.target.value)} />
                  {errors.name && <p className="text-red-400 text-xs mt-1">{errors.name}</p>}
                </div>
                <input className={inputBase} placeholder="Tu vehículo (opcional)" value={form.vehicle} onChange={e=>set('vehicle',e.target.value)} />
              </div>
              <input className={inputBase} placeholder="Servicio realizado (opcional)" value={form.service} onChange={e=>set('service',e.target.value)} />
              <div>
                <textarea className={`${inputBase} resize-none`} rows={4}
                  placeholder="Contanos tu experiencia... *" value={form.comment} onChange={e=>set('comment',e.target.value)} />
                <div className="flex justify-between mt-1">
                  {errors.comment ? <p className="text-red-400 text-xs">{errors.comment}</p> : <span/>}
                  <span className={`text-xs ${charLeft<50?'text-red-400':'text-white/20'}`}>{charLeft}</span>
                </div>
              </div>
              {/* Stars */}
              <div className="flex items-center gap-3">
                <span className="text-white/40 text-sm">Puntuación:</span>
                <div className="flex gap-1">
                  {[1,2,3,4,5].map(n => (
                    <button key={n} type="button" onClick={()=>set('rating',n)}
                      className={`text-xl transition-colors ${n<=form.rating?'text-brand':'text-white/15 hover:text-white/30'}`}>★</button>
                  ))}
                </div>
              </div>
              {/* Photo upload */}
              <div>
                <input ref={fileRef} type="file" accept="image/jpeg,image/png,image/webp" className="hidden" onChange={uploadPhoto} />
                {preview ? (
                  <div className="relative rounded-xl overflow-hidden">
                    <img src={preview} alt="preview" className="w-full object-cover" style={{maxHeight:200}} />
                    <button type="button" onClick={()=>{set('photo',null);setPreview(null);}}
                      className="absolute top-2 right-2 w-8 h-8 rounded-lg bg-black/70 text-white flex items-center justify-center hover:bg-red-600 transition-colors">
                      <i className="fas fa-times text-sm"></i>
                    </button>
                    <div className="absolute bottom-2 left-2 bg-black/60 text-xs text-white/60 px-2 py-1 rounded-lg">
                      Vista previa

                    className="w-full border-2 border-dashed border-white/[.08] rounded-xl py-6 text-white/25 hover:border-brand/30 hover:text-white/40 transition-colors text-sm flex flex-col items-center gap-2">
                    <i className="fas fa-camera text-2xl"></i>
                    <span>Subir foto del auto (opcional)</span>

                {errors.photo && <p className="text-red-400 text-xs mt-1">{errors.photo}</p>}

              <button type="submit" disabled={loading}

                {loading ? <><i className="fas fa-circle-notch fa-spin"></i> Enviando...</> : <><i className="fas fa-paper-plane"></i> Enviar reseña</>}
              </button>
            </form>
          </div>
        </section>
      );
    }

    function Booking() {
      const titleRef = useReveal();
      const cardRef  = useReveal(120);

      const [form, setForm]   = useState({ service:'', date:'', time:'', name:'', phone:'', vehicle:'' });
      const [err,  setErr]    = useState({});
      const [done, setDone]   = useState(false);
      const [saved, setSaved] = useState(null); // guarda los datos del turno para mostrar en el resumen

      const upd = (k, v) => {
        setForm(p => ({ ...p, [k]: v }));
        setErr(p => ({ ...p, [k]: false }));
      };

      const submit = () => {
        const e = {};
        const required = ['service','date','time','name','phone'];
        required.forEach(k => { if (!form[k].trim()) e[k] = true; });
        setErr(e);
        if (Object.keys(e).length) return;

        // Guardar en localStorage para que el admin pueda verlo y responder con WA
        try {
          const bookings = JSON.parse(localStorage.getItem('morrey_bookings') || '[]');
          bookings.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2),
            ...form,
            status: 'pending',
            createdAt: new Date().toISOString()
          });
          localStorage.setItem('morrey_bookings', JSON.stringify(bookings));
        } catch(_) {}

        setSaved({ ...form });
        setDone(true);
      };

      const reset = () => {
        setForm({ service:'', date:'', time:'', name:'', phone:'', vehicle:'' });
        setErr({});
        setDone(false);
        setSaved(null);
      };

      const base = f => `w-full bg-[#0d0d0d] border ${err[f] ? 'border-red-500/60' : 'border-white/[.1]'} rounded-xl px-4 py-3 text-white text-sm placeholder-white/20 focus:outline-none focus:border-brand/50 focus:ring-1 focus:ring-brand/20 transition-all`;

      // Formatear fecha para mostrar
      const fechaDisplay = (dateStr) => {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-');
        const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        return `${parseInt(d)} de ${meses[parseInt(m)-1]} de ${y}`;
      };

      return (
        <section id="turnos" className="py-24 bg-[#080808]">
          <div className="max-w-3xl mx-auto px-5 md:px-8">

            <div className="text-center mb-12">
              <div ref={titleRef} className="rv">
                <span className="text-brand text-[11px] font-semibold tracking-widest uppercase">Reservá online</span>
                <h2 className="text-4xl md:text-5xl font-black mt-3 mb-4">Agendá tu turno</h2>
                <p className="text-white/45 text-base max-w-md mx-auto">
                  Completá el formulario — te confirmamos el turno el mismo día por WhatsApp.
                </p>
                <div className="flex items-center justify-center gap-2 mt-4">
                  <span className="text-white/30 text-sm">¿Preferís escribirnos directo?</span>
                  <a href={`${WA_BASE}?text=${encodeURIComponent('Hola! Quiero pedir un turno. ¿Qué fechas tienen disponibles?')}`}
                    target="_blank" rel="noopener noreferrer"
                    className="inline-flex items-center gap-1.5 text-[#25D366] text-sm font-semibold hover:underline">
                    <i className="fab fa-whatsapp"></i> WhatsApp
                  </a>
                </div>
              </div>
            </div>

            <div ref={cardRef} className="rv bg-[#111] border border-white/[.08] rounded-3xl p-7 md:p-10">

              {done ? (
                /* ---- ESTADO: TURNO RECIBIDO ---- */
                <div className="text-center py-6">
                  <div className="w-16 h-16 bg-brand/15 border border-brand/30 rounded-full flex items-center justify-center mx-auto mb-5">
                    <i className="fas fa-clock text-brand text-2xl"></i>
                  </div>
                  <h3 className="text-2xl font-black text-white mb-2">¡Solicitud recibida!</h3>
                  <p className="text-white/50 text-sm mb-6 max-w-xs mx-auto leading-relaxed">
                    Tu turno está <span className="text-brand font-semibold">pendiente de confirmación</span>. Te vamos a avisar por WhatsApp a la brevedad.
                  </p>

                  {/* Resumen */}
                  <div className="bg-[#0d0d0d] border border-white/[.07] rounded-2xl p-5 text-left mb-6 space-y-2.5">
                    {[
                      { icon:'fa-concierge-bell', label:'Servicio',  val: saved.service  },
                      { icon:'fa-calendar',        label:'Fecha',     val: fechaDisplay(saved.date) },
                      { icon:'fa-clock',           label:'Horario',   val: saved.time + ' hs'       },
                      { icon:'fa-user',            label:'Nombre',    val: saved.name     },
                      { icon:'fa-phone',           label:'Celular',   val: saved.phone    },
                      { icon:'fa-car',             label:'Vehículo',  val: saved.vehicle  },
                    ].map(r => (
                      <div key={r.label} className="flex items-center gap-3 text-sm">
                        <i className={`fas ${r.icon} text-brand text-xs w-4 text-center`}></i>
                        <span className="text-white/40 w-16 flex-shrink-0">{r.label}</span>
                        <span className="text-white/85 font-medium">{r.val}</span>
                      </div>
                    ))}
                  </div>

                  <a href={`${WA_BASE}?text=${encodeURIComponent(`Hola! Acabo de solicitar un turno online. Soy ${saved?.name}, pedí ${saved?.service} para el ${fechaDisplay(saved?.date)} a las ${saved?.time}hs. ¿Me podés confirmar?`)}`}
                    target="_blank" rel="noopener noreferrer"
                    className="w-full mt-2 mb-4 py-3.5 bg-[#25D366] hover:bg-[#1ebe5d] text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-colors text-sm">
                    <i className="fab fa-whatsapp text-base"></i>
                    Confirmar por WhatsApp ahora
                  </a>

                  <button onClick={reset}
                    className="text-white/35 hover:text-white/65 text-sm transition-colors underline underline-offset-2">
                    Hacer otra reserva
                  </button>
                </div>

              ) : (
                /* ---- ESTADO: FORMULARIO ---- */
                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-6">

                    {/* Servicio */}
                    <div>
                      <label className="block text-white/45 text-[11px] font-semibold uppercase tracking-wider mb-2">Servicio *</label>
                      <select value={form.service} onChange={e => upd('service', e.target.value)}
                        style={{ background:'#0d0d0d' }} className={base('service') + ' cursor-pointer'}>
                        <option value="">Seleccionar servicio</option>
                        {SERVICES.map(s => <option key={s.name} value={s.name}>{s.name}</option>)}
                      </select>
                      {err.service && <p className="text-red-400/70 text-[11px] mt-1">Requerido</p>}
                    </div>

                    {/* Fecha */}
                    <div>
                      <label className="block text-white/45 text-[11px] font-semibold uppercase tracking-wider mb-2">Fecha *</label>
                      <input type="date" value={form.date}
                        onChange={e => { upd('date', e.target.value); upd('time', ''); }}
                        min={new Date().toISOString().split('T')[0]}
                        className={base('date')} />
                      {err.date && <p className="text-red-400/70 text-[11px] mt-1">Requerido</p>}
                      {form.date && getAvailableTimes(form.date).length === 0 && (
                        <p className="text-red-400/70 text-[11px] mt-1">Domingos cerrado</p>
                      )}
                    </div>

                    {/* Horario */}
                    <div>
                      <label className="block text-white/45 text-[11px] font-semibold uppercase tracking-wider mb-2">Horario *</label>
                      <select value={form.time} onChange={e => upd('time', e.target.value)}
                        style={{ background:'#0d0d0d' }}
                        disabled={!form.date || getAvailableTimes(form.date).length === 0}
                        className={base('time') + ' cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed'}>
                        <option value="">
                          {!form.date ? 'Primero elegí una fecha' : getAvailableTimes(form.date).length === 0 ? 'Domingos cerrado' : 'Seleccionar horario'}
                        </option>
                        {getAvailableTimes(form.date).map(t => <option key={t} value={t}>{t} hs</option>)}
                      </select>
                      {err.time && <p className="text-red-400/70 text-[11px] mt-1">Requerido</p>}
                    </div>

                    {/* Nombre */}
                    <div>
                      <label className="block text-white/45 text-[11px] font-semibold uppercase tracking-wider mb-2">Nombre completo *</label>
                      <input type="text" value={form.name} onChange={e => upd('name', e.target.value)}
                        placeholder="Tu nombre y apellido" autoComplete="name" className={base('name')} />
                      {err.name && <p className="text-red-400/70 text-[11px] mt-1">Requerido</p>}
                    </div>

                    {/* Teléfono */}
                    <div>
                      <label className="block text-white/45 text-[11px] font-semibold uppercase tracking-wider mb-2">Teléfono *</label>
                      <input type="tel" value={form.phone} onChange={e => upd('phone', e.target.value)}
                        placeholder="11 1234-5678" autoComplete="tel" className={base('phone')} />
                      {err.phone && <p className="text-red-400/70 text-[11px] mt-1">Requerido</p>}
                    </div>

                    {/* Vehículo */}
                    <div>
                      <label className="block text-white/45 text-[11px] font-semibold uppercase tracking-wider mb-2">Vehículo <span className="text-white/25 normal-case font-normal">(opcional)</span></label>
                      <input type="text" value={form.vehicle} onChange={e => upd('vehicle', e.target.value)}
                        placeholder="Ej: Toyota Corolla 2021" className={base('vehicle')} />
                    </div>
                  </div>

                  <button onClick={submit}
                    className="w-full py-4 bg-brand hover:bg-brand-dark text-black font-bold text-base rounded-2xl flex items-center justify-center gap-2.5 transition-all hover:-translate-y-0.5 hover:shadow-xl hover:shadow-brand/20 active:translate-y-0">
                    <i className="fas fa-calendar-check text-lg"></i>
                    Solicitar turno
                  </button>

                  <p className="text-white/20 text-[11px] text-center mt-4 leading-relaxed">
                    Una vez que recibamos tu solicitud te confirmamos el turno por WhatsApp.
                  </p>
                </>
              )}
            </div>
          </div>
        </section>
      );
    }

    /* =============================================
       CTA FINAL
    ============================================= */

    function CTA() {
      const ref = useReveal();
      return (
        <section className="py-28 bg-[#0d0d0d] border-t border-white/[.05] relative overflow-hidden">
          {/* Ambient glow */}
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[700px] h-[500px] bg-brand/[.03] rounded-full blur-3xl pointer-events-none" />
          <div className="absolute inset-0 bg-gradient-to-br from-brand/[.03] via-transparent to-transparent pointer-events-none" />

          <div className="relative max-w-3xl mx-auto px-5 text-center" ref={ref}>
            <div className="rv">
              <span className="text-brand text-[11px] font-semibold tracking-widest uppercase">¿Listo para transformar tu auto?</span>
              <h2 className="text-4xl md:text-6xl font-black mt-4 mb-5 leading-tight">
                Escribinos hoy<br />y coordinamos<br />
                <span className="text-gradient">tu turno ahora.</span>
              </h2>
              <p className="text-white/50 text-lg mb-3 max-w-xl mx-auto leading-relaxed">
                Sin vueltas. Respondemos rápido y confirmamos el mismo día.
              </p>
              <p className="text-white/30 text-sm mb-10">Lun–Vie 9–18hs · Sáb 9–13hs · Buenos Aires</p>

              <a href={`${WA_BASE}?text=${encodeURIComponent('Hola Morrey Detailing! Quiero consultar precios y disponibilidad para hacer un servicio. ¿Cuándo tienen lugar?')}`}
                target="_blank" rel="noopener noreferrer"
                className="inline-flex items-center gap-3 px-10 py-5 bg-[#25D366] hover:bg-[#1ebe5d] text-white font-bold text-xl rounded-2xl transition-all hover:-translate-y-1 hover:shadow-2xl hover:shadow-green-500/20 active:translate-y-0">
                <i className="fab fa-whatsapp text-2xl"></i>
                Pedir turno por WhatsApp
              </a>

              <div className="mt-14 flex flex-wrap items-center justify-center gap-8">
                <a href="tel:+541156359321" className="flex items-center gap-2 text-white/40 hover:text-white/70 transition-colors text-sm">
                  <i className="fas fa-phone text-brand text-xs"></i> 11 5635-9321
                </a>
                <a href="https://www.instagram.com/morrey.detail/" target="_blank" rel="noopener noreferrer"
                  className="flex items-center gap-2 text-white/40 hover:text-white/70 transition-colors text-sm">
                  <i className="fab fa-instagram text-brand text-xs"></i> @morrey.detail
                </a>
                <span className="flex items-center gap-2 text-white/35 text-sm">
                  <i className="fas fa-clock text-brand text-xs"></i> Lun–Vie 9–18hs · Sáb 9–13hs
                </span>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* =============================================
       FOOTER
    ============================================= */

    function Footer() {
      return (
        <footer className="bg-[#080808] border-t border-white/[.04] pt-10 pb-6 px-5">
          <div className="max-w-6xl mx-auto">
            <div className="flex flex-col md:flex-row items-center justify-between gap-8 pb-8 border-b border-white/[.04]">

              <div className="flex items-center gap-3">
                <img src="logo.png" alt="Morrey Detailing" className="h-10 w-auto object-contain" />
                <div>
                  <div className="font-bold text-white text-sm">Morrey Detailing</div>
                  <div className="text-white/30 text-xs mt-0.5">Detailing automotriz premium</div>
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-center gap-6">
                {NAV_LINKS.map(l => (
                  <button key={l.id} onClick={() => goTo(l.id)}
                    className="text-white/35 hover:text-white/70 text-sm transition-colors">
                    {l.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-3">
                <a href={WA_BASE} target="_blank" rel="noopener noreferrer"
                  className="w-9 h-9 bg-[#25D366]/[.1] border border-[#25D366]/20 rounded-full flex items-center justify-center text-[#25D366] hover:bg-[#25D366]/20 transition-colors text-sm">
                  <i className="fab fa-whatsapp"></i>
                </a>
                <a href="https://www.instagram.com/morrey.detail/" target="_blank" rel="noopener noreferrer"
                  className="w-9 h-9 bg-brand/[.1] border border-brand/20 rounded-full flex items-center justify-center text-brand hover:bg-brand/20 transition-colors text-sm">
                  <i className="fab fa-instagram"></i>
                </a>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between gap-2 pt-5">
              <p className="text-white/18 text-xs">© 2026 Morrey Detailing. Todos los derechos reservados.</p>
              <div className="flex items-center gap-4">
                <span className="text-white/18 text-xs">Buenos Aires, Argentina</span>
                <a href="admin.html" className="text-white/[.08] hover:text-white/25 text-xs transition-colors">Admin</a>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    /* =============================================
       WHATSAPP FLOAT
    ============================================= */

    function WAFloat() {
      return (
        <a href={`${WA_BASE}?text=${encodeURIComponent('Hola Morrey Detailing! Quiero consultar precios y disponibilidad.')}`}
          target="_blank" rel="noopener noreferrer" aria-label="Contactar por WhatsApp"
          className="wa-float-btn fixed bottom-6 right-6 z-50 flex items-center gap-3 bg-[#25D366] text-white font-bold rounded-full wa-ripple hover:-translate-y-1 transition-transform shadow-xl shadow-black/40"
          style={{padding:'14px 18px',paddingRight:20}}>
          <i className="fab fa-whatsapp text-2xl flex-shrink-0"></i>
          <span className="wa-float-label text-sm">Pedir turno</span>
        </a>
      );
    }

    /* =============================================
       APP
    ============================================= */

    function App() {
      return (
        <>
          <Navbar />
          <Hero />
          <Stats />
          <Services />
          <HowItWorks />
          <Gallery />
          <WhyUs />
          <Testimonials />
          <Booking />
          <CTA />
          <Footer />
          <WAFloat />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
